<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F4F1EF">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>Kraftbuch</title>
<script>(function(){try{var t=localStorage.getItem('kraftbuch.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>
/* VOICE: ruhiger, aufmunternder Trainer – kurze deutsche Wörter, nichts Überflüssiges.
   IDEA: ein gut geführtes Trainingsbuch – jedes Training eine Seite, der Plan eine nummerierte Ablaufliste.
   PICTURE: die eigene Muskelkarte, die die Muskeln des Tages aufleuchten lässt; Satz-Kacheln, die sich füllen.
   COLOUR & TYPE: Glut-Orange auf warmem Stein bzw. fast Schwarz, Bernstein für Hilfsmuskeln, Grün für Erledigtes; Systemschrift, runde Ziffern.
   LAYOUT: iOS – große Titel, ruhige Karten, schwebende Glas-Leiste (iPad: Seitenleiste), Training im Vollbild mit Mini-Leiste. */
:root{
  color-scheme:light;
  --bg:#F3F0EE;--card:#FFFFFF;--card-2:#F6F3F1;--sheet:#F4F1EF;--side-bg:#EFEBE8;
  --fg:#1A1210;--fg-2:rgba(26,18,16,.62);--fg-3:rgba(26,18,16,.38);
  --sep:rgba(26,18,16,.10);--fill:rgba(118,100,94,.11);--fill-2:rgba(118,100,94,.20);
  --accent:#D63A0B;--accent-ink:#FFFFFF;--accent-soft:rgba(214,58,11,.10);--accent-line:rgba(214,58,11,.32);
  --accent-grad:linear-gradient(135deg,#FF6E2E 0%,#DB3D0B 100%);
  --amber:#A05400;--amber-grad:linear-gradient(135deg,#FFB648,#F08A12);--amber-fill:#FFC266;--amber-ink:#4A2700;
  --good:#1B8A47;--good-soft:rgba(32,160,85,.12);--good-fill:#23A65A;--good-ink:#FFFFFF;--good-line:rgba(35,166,90,.45);
  --warn:#A35F00;--warn-c:#F39C12;--danger:#D21F3C;--danger-soft:rgba(210,31,60,.10);
  --bar:rgba(250,248,247,.78);--glass:rgba(255,255,255,.72);--glass-line:rgba(255,255,255,.9);--seg-k:#FFFFFF;
  --scrim:rgba(20,10,8,.34);--toast-bg:rgba(30,22,20,.94);--toast-fg:#FFFFFF;--glow:rgba(255,106,43,.20);
  --shadow:0 1px 2px rgba(40,15,8,.05),0 8px 24px -14px rgba(40,15,8,.20);
  --sh-float:0 12px 36px -12px rgba(40,15,8,.38),0 2px 6px rgba(40,15,8,.06);
  --body:#E7E0DD;--muscle:#D4CAC6;--map-gap:#F8F5F4;--hl-1:#EE4A14;--hl-2:#FDB78A;
  --c-teal:#30B0C7;--c-green:#34C759;--c-yellow:#E6A800;--c-orange:#FF9500;--c-red:#FF3B30;--c-pink:#FF2D55;--c-purple:#AF52DE;
  --c-indigo:#5856D6;--c-blue:#007AFF;--c-sky:#3D9BE0;--c-brown:#A2845E;--c-slate:#5E6B7A;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));
  --nb-h:52px;--tb-h:64px;--tb-b:max(12px,calc(env(safe-area-inset-bottom,0px) - 8px));
  --bottom:calc(var(--tb-h) + var(--tb-b) + 30px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0C0A09;--card:#1A1615;--card-2:#231E1C;--sheet:#141110;--side-bg:#120F0E;
  --fg:#F7F2F0;--fg-2:rgba(247,242,240,.64);--fg-3:rgba(247,242,240,.38);
  --sep:rgba(255,255,255,.09);--fill:rgba(160,140,132,.16);--fill-2:rgba(160,140,132,.28);
  --accent:#FF6B35;--accent-ink:#1C0A03;--accent-soft:rgba(255,107,53,.15);--accent-line:rgba(255,107,53,.42);
  --accent-grad:linear-gradient(135deg,#FF8A50 0%,#F2561C 100%);
  --amber:#FFB25C;--amber-fill:#FFB340;--amber-ink:#3A1E00;
  --good:#4CD982;--good-soft:rgba(76,217,130,.14);--good-fill:#30D158;--good-ink:#03240F;--good-line:rgba(48,209,88,.5);
  --warn:#FFB340;--danger:#FF5468;--danger-soft:rgba(255,84,104,.15);
  --bar:rgba(26,22,21,.76);--glass:rgba(44,38,36,.7);--glass-line:rgba(255,255,255,.08);--seg-k:#3B3431;
  --scrim:rgba(0,0,0,.56);--toast-bg:rgba(48,42,40,.96);--glow:rgba(255,107,53,.16);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7);
  --sh-float:0 14px 40px -12px rgba(0,0,0,.8),0 0 0 .5px rgba(255,255,255,.06);
  --body:#2F2826;--muscle:#3F3532;--map-gap:#1B1615;--hl-1:#FF6A33;--hl-2:#A0522F;
  --c-teal:#40C8E0;--c-green:#30D158;--c-yellow:#FFCC33;--c-orange:#FF9F0A;--c-red:#FF453A;--c-pink:#FF375F;--c-purple:#BF5AF2;
  --c-indigo:#5E5CE6;--c-blue:#0A84FF;--c-sky:#5AB0F0;--c-brown:#AC8E68;--c-slate:#8394A8;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C0A09;--card:#1A1615;--card-2:#231E1C;--sheet:#141110;--side-bg:#120F0E;
  --fg:#F7F2F0;--fg-2:rgba(247,242,240,.64);--fg-3:rgba(247,242,240,.38);
  --sep:rgba(255,255,255,.09);--fill:rgba(160,140,132,.16);--fill-2:rgba(160,140,132,.28);
  --accent:#FF6B35;--accent-ink:#1C0A03;--accent-soft:rgba(255,107,53,.15);--accent-line:rgba(255,107,53,.42);
  --accent-grad:linear-gradient(135deg,#FF8A50 0%,#F2561C 100%);
  --amber:#FFB25C;--amber-fill:#FFB340;--amber-ink:#3A1E00;
  --good:#4CD982;--good-soft:rgba(76,217,130,.14);--good-fill:#30D158;--good-ink:#03240F;--good-line:rgba(48,209,88,.5);
  --warn:#FFB340;--danger:#FF5468;--danger-soft:rgba(255,84,104,.15);
  --bar:rgba(26,22,21,.76);--glass:rgba(44,38,36,.7);--glass-line:rgba(255,255,255,.08);--seg-k:#3B3431;
  --scrim:rgba(0,0,0,.56);--toast-bg:rgba(48,42,40,.96);--glow:rgba(255,107,53,.16);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7);
  --sh-float:0 14px 40px -12px rgba(0,0,0,.8),0 0 0 .5px rgba(255,255,255,.06);
  --body:#2F2826;--muscle:#3F3532;--map-gap:#1B1615;--hl-1:#FF6A33;--hl-2:#A0522F;
  --c-teal:#40C8E0;--c-green:#30D158;--c-yellow:#FFCC33;--c-orange:#FF9F0A;--c-red:#FF453A;--c-pink:#FF375F;--c-purple:#BF5AF2;
  --c-indigo:#5E5CE6;--c-blue:#0A84FF;--c-sky:#5AB0F0;--c-brown:#AC8E68;--c-slate:#8394A8;
}

/* ---------- Grundlagen ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
html{-webkit-text-size-adjust:100%}
body{color:var(--fg);font:16px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default}
input,select,textarea{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i.f{fill:currentColor;stroke-width:1.4}
.muted{color:var(--fg-2)}
.grow{flex:1}

/* ---------- Gerüst ---------- */
#app,.shell{position:fixed;inset:0}
.stage{position:absolute;inset:0;overflow:hidden;transform-origin:50% 40%;transition:transform .5s var(--ease),border-radius .5s var(--ease),filter .5s ease}
.tabpane{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .2s ease,transform .3s var(--ease),visibility 0s .3s}
.tabpane.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s ease,transform .4s var(--ease),visibility 0s}
.stack{position:absolute;inset:0;overflow:hidden}
.pgw{position:absolute;inset:0;background:var(--bg)}
.pgw.pg-under{transform:translateX(-28%);visibility:hidden;transition:transform .46s var(--ease),visibility 0s .46s}
.pgw.pg-in{animation:pgIn .46s var(--ease) both;box-shadow:-12px 0 32px rgba(0,0,0,.10)}
.pgw.pg-back{animation:pgBack .46s var(--ease) both}
.pgw.pg-out{animation:pgOut .44s var(--ease) both;z-index:5;pointer-events:none;box-shadow:-12px 0 32px rgba(0,0,0,.10)}
.pg{position:absolute;inset:0;display:flex;flex-direction:column}
.pg-sc{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pg-in{width:100%;max-width:1060px;margin:0 auto;padding:calc(var(--nb-h) + env(safe-area-inset-top,0px)) var(--gut-r) var(--bottom) var(--gut-l)}
.has-mini .pg-in{padding-bottom:calc(var(--bottom) + 66px)}
.pg.has-foot .pg-in{padding-bottom:calc(var(--bottom) + 70px)}
.has-mini .pg.has-foot .pg-in{padding-bottom:calc(var(--bottom) + 136px)}

/* Navigationsleiste & großer Titel */
.nb{position:absolute;z-index:4;top:0;left:0;right:0;height:calc(var(--nb-h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;transition:background-color .25s ease,box-shadow .25s ease}
.pg.sc .nb{background:var(--bar);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:0 .5px 0 var(--sep)}
.nb-l{justify-self:start;max-width:100%}
.nb-r{justify-self:end;display:flex;gap:8px;align-items:center}
.nb-t{font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;opacity:0;transform:translateY(8px);transition:opacity .22s ease,transform .35s var(--ease)}
.pg.sc .nb-t{opacity:1;transform:none}
.nb-back{display:flex;align-items:center;gap:1px;height:40px;padding:0 14px 0 6px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow),inset 0 0 0 .5px var(--glass-line);color:var(--fg);font-size:16px;font-weight:550;max-width:100%;transition:transform .2s var(--spring)}
.nb-back:active{transform:scale(.94)}
.nb-back .i{width:24px;height:24px;stroke-width:2.4;color:var(--accent)}
.nb-back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow),inset 0 0 0 .5px var(--glass-line);color:var(--fg);transition:transform .2s var(--spring)}
.nb-ic:active{transform:scale(.9)}
.nb-ic.sm{width:32px;height:32px;background:var(--fill);box-shadow:none}
.nb-ic.sm .i{width:18px;height:18px}
.nb-txt{height:40px;padding:0 16px;border-radius:20px;background:var(--glass);box-shadow:var(--shadow),inset 0 0 0 .5px var(--glass-line);color:var(--accent);font-weight:650}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 2px 16px}
.lt-tx{min-width:0}
.lt h1{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.025em}
.long-t .lt h1{font-size:29px}
.lt-sub{color:var(--fg-2);font-size:15px;margin-top:5px}
.lt-r{flex:none;padding-bottom:4px}
.pg-foot{position:absolute;z-index:3;left:0;right:0;bottom:calc(var(--tb-h) + var(--tb-b) + 12px);padding:0 var(--gut-r) 0 var(--gut-l);display:flex;justify-content:center;pointer-events:none;animation:footIn .5s var(--spring) .1s backwards}
.pg-foot .btn{pointer-events:auto;width:100%;max-width:520px;box-shadow:var(--sh-float)}
.has-mini .pg-foot{bottom:calc(var(--tb-h) + var(--tb-b) + 78px)}

/* Reiterleiste */
.tabbar{position:fixed;z-index:20;left:50%;bottom:var(--tb-b);transform:translateX(-50%);width:min(440px,calc(100% - 28px));height:var(--tb-h);border-radius:32px;padding:6px;background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);box-shadow:var(--sh-float),inset 0 0 0 .5px var(--glass-line)}
.tb-brand{display:none}
.tb-items{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:100%}
.tb-k{position:absolute;top:0;bottom:0;left:0;width:25%;border-radius:26px;background:var(--accent-soft);transform:translateX(calc(var(--i) * 100%));transition:transform .55s var(--spring)}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:26px;color:var(--fg-2);font-size:11px;font-weight:650;transition:color .25s}
.tb .i{width:24px;height:24px}
.tb.on{color:var(--accent)}
.tb.on .i{animation:tbPop .55s var(--spring)}
.tb:active .i{transform:scale(.88)}

/* Mini-Leiste für das laufende Training */
.mini{position:fixed;z-index:19;left:50%;bottom:calc(var(--tb-b) + var(--tb-h) + 10px);width:min(440px,calc(100% - 28px));height:58px;border-radius:29px;background:var(--card);box-shadow:var(--sh-float),inset 0 0 0 .5px var(--sep);display:flex;align-items:center;gap:12px;padding:0 12px 0 18px;text-align:left;transform:translateX(-50%) translateY(24px) scale(.92);opacity:0;pointer-events:none;transition:transform .5s var(--spring),opacity .25s ease}
.mini.on{transform:translateX(-50%);opacity:1;pointer-events:auto}
.mini:active{transform:translateX(-50%) scale(.97)}
.mini-tx{flex:1;display:flex;flex-direction:column;line-height:1.2}
.mini-tx b{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-tx small{font-size:13px;color:var(--fg-2)}
.pulse-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.8s ease-out infinite}

/* Hintergrund rückt beim Blatt etwas nach hinten */
.shell.sheet-on .stage{transform:scale(.955) translateY(6px);border-radius:24px;filter:brightness(.92)}
.shell.sheet-on.wo-on .wo.open{transform:scale(.955) translateY(6px);border-radius:24px}

/* ---------- Bausteine ---------- */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 14px;text-align:left;transition:background-color .2s}
button.row:active{background:var(--fill)}
button.row:disabled{opacity:.5}
.row+.row::before,.row+div>.row:first-child::before{content:"";position:absolute;top:0;left:72px;right:0;height:1px;transform:scaleY(.5);transform-origin:top;background:var(--sep)}
.row-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-tx b{font-size:16px;font-weight:600;line-height:1.25;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.row-tx small{font-size:13.5px;color:var(--fg-2);line-height:1.3}
.chev{width:18px;height:18px;color:var(--fg-3);stroke-width:2.5}
.empty-row{color:var(--fg-2);font-size:15px;justify-content:center}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 4px 10px}
.sec-h h2{font-size:21px;font-weight:750;letter-spacing:-.015em}
.sec-h small{color:var(--fg-2);font-size:14px}
.sub-h{font-size:17px;font-weight:700;margin:6px 2px -4px}
.note{font-size:13.5px;color:var(--fg-2);line-height:1.45;padding:0 4px}
.note.center{text-align:center}
.note.warn{color:var(--warn)}
.link{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:15.5px;font-weight:600}
.link .i{width:17px;height:17px;stroke-width:2.4}
.link.inline{display:inline;font-size:inherit}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:26px;font-size:16.5px;font-weight:700;background:var(--fill);color:var(--fg);white-space:nowrap;-webkit-user-select:none;user-select:none;transition:transform .2s var(--spring),opacity .2s,filter .2s,background-color .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.38;pointer-events:none}
.btn .i{width:20px;height:20px}
.btn.go{background:var(--accent-grad);color:var(--accent-ink);box-shadow:0 10px 26px -14px var(--accent)}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.danger-solid{background:var(--danger);color:#fff}
.btn.block{display:flex;width:100%}
.btn.sm{height:36px;padding:0 14px;border-radius:18px;font-size:15px}
.btn.sm .i{width:17px;height:17px}
.btn.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-120%);animation:shine 5s ease-in-out 1.4s infinite;pointer-events:none}
.btn-row{display:flex;gap:10px}
.add-btn{margin-top:16px}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--fg);flex:none;transition:transform .2s var(--spring),opacity .2s}
.ibtn:active{transform:scale(.9)}
.ibtn:disabled{opacity:.3}
.ibtn .i{width:20px;height:20px}
.ibtn.sm{width:32px;height:32px}
.ibtn.sm .i{width:18px;height:18px}
.chip-btn{flex:none;height:34px;padding:0 12px 0 9px;border-radius:17px;background:var(--fill);color:var(--fg);font-size:14px;font-weight:650;display:inline-flex;align-items:center;gap:4px;transition:transform .2s var(--spring)}
.chip-btn:active{transform:scale(.94)}
.chip-btn .i{width:17px;height:17px}
.mi{width:34px;height:34px;border-radius:10px;background:var(--fill);display:grid;place-items:center;flex:none;color:var(--fg)}
.mi .i{width:19px;height:19px}
.mi.dg{background:var(--danger-soft);color:var(--danger)}
.mi.gold{background:rgba(255,186,40,.18);color:#C68400}
.mi.acc{background:var(--accent-soft);color:var(--accent)}
.row.danger b{color:var(--danger)}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;background:var(--fill);font-size:12.5px;font-weight:650;color:var(--fg-2);white-space:nowrap;flex:none}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag .i{width:14px;height:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ok-dot{width:26px;height:26px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;flex:none}
.ok-dot .i{width:15px;height:15px;stroke-width:3}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 10px 0 12px;background:var(--fg-3)}
.sdot.good{background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.sdot.warn{background:var(--warn-c)}
.no{flex:none;min-width:30px;height:26px;padding:0 6px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:13.5px;font-weight:800;display:inline-grid;place-items:center}

/* Segmente, Schalter, Zahlen */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--fill);border-radius:13px;padding:3px;isolation:isolate}
.seg-k{position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));border-radius:10px;background:var(--seg-k);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transform:translateX(calc(var(--i) * 100%));transition:transform .45s var(--spring)}
.seg button{height:36px;padding:0 6px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;transition:color .2s}
.seg button.on{color:var(--fg)}
.seg button:active{transform:scale(.96)}
.tg{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill-2);transition:background-color .25s}
.tg i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .4s var(--spring)}
.tg.on{background:var(--good-fill)}
.tg.on i{transform:translateX(20px)}
.step{display:inline-flex;align-items:center;gap:6px;flex:none}
.step-b{width:42px;height:42px;border-radius:13px;background:var(--fill);color:var(--fg);display:grid;place-items:center;flex:none;transition:transform .18s var(--spring),background-color .2s}
.step-b:active{transform:scale(.88);background:var(--fill-2)}
.step-b .i{width:20px;height:20px;stroke-width:2.4}
.step-v{min-width:52px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.step-v .roll{font-family:var(--font-num);font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
.step-v small{font-size:11.5px;color:var(--fg-2);font-weight:600}
.step.big{display:flex;justify-content:center;gap:20px;margin:8px 0 2px}
.step.big .step-b{width:64px;height:64px;border-radius:50%}
.step.big .step-b .i{width:26px;height:26px}
.step.big .step-v{min-width:120px}
.step.big .step-v .roll{font-size:56px;font-weight:800;letter-spacing:-.03em}
.step.big .step-v small{font-size:14px;margin-top:2px}
.roll{position:relative;display:inline-grid;overflow:hidden;vertical-align:bottom}
.roll>span{grid-area:1/1;text-align:center}
.roll-n.anim{animation:rollIn .36s var(--spring) both}
.roll.dn .roll-n.anim{animation-name:rollInDn}
.roll-o{animation:rollOut .3s ease both}
.roll.dn .roll-o{animation-name:rollOutDn}
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring-t{fill:none;stroke:var(--fill-2)}
.ring-v{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s var(--spring)}
.ring-c{position:relative;font-size:15px;font-weight:800;line-height:1}
.ring-c small{font-size:12px}

/* Suche & Chips */
.search{position:relative;flex:1;display:flex;align-items:center;gap:8px;height:44px;border-radius:13px;background:var(--fill);padding:0 10px 0 12px}
.search>.i{width:19px;height:19px;color:var(--fg-3)}
.search input{flex:1;height:100%;border:0;background:transparent;font-size:16.5px;color:var(--fg);outline:none;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--fg-3)}
.search-x{width:22px;height:22px;border-radius:50%;background:var(--fg-3);color:var(--bg);display:grid;place-items:center;flex:none;animation:popIn .3s var(--spring)}
.search-x .i{width:13px;height:13px;stroke-width:3}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px var(--gut-r) 4px var(--gut-l);margin:0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l))}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;height:36px;padding:0 15px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep);font-size:14.5px;font-weight:600;color:var(--fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color .25s,color .25s,transform .2s var(--spring),box-shadow .25s}
.chip:active{transform:scale(.94)}
.chip .i{width:17px;height:17px}
.chip.on{background:var(--fg);color:var(--bg);box-shadow:none}
.chips.wrap .chip{height:34px;font-size:14px}
.chips.wrap .chip.on{background:var(--hl-1);color:#fff}
.chips.wrap .chip.sec.on{background:var(--hl-2);color:#3A1A00}

/* Vorschaubilder & Muskelkarte */
.thumb{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;overflow:hidden;background:color-mix(in oklab,var(--c,var(--accent)) 12%,var(--card))}
.thumb svg{width:46px;height:46px;display:block}
.thumb.cardio{background:color-mix(in oklab,var(--c-sky) 16%,var(--card));color:var(--c-sky)}
.thumb.cardio .i{width:24px;height:24px}
.thumb.lg{width:58px;height:58px;border-radius:16px}
.thumb.lg svg{width:58px;height:58px}
.bmw{flex:none}
.bmw svg{display:block;width:100%;height:auto}
.bodymap{display:block;width:100%;height:auto}
.bm-sil path{fill:var(--body)}
.bm-m use{fill:var(--muscle);stroke:var(--map-gap);stroke-width:1.1;stroke-linejoin:round}
.bm-p{fill:var(--hl-1);stroke:var(--map-gap);stroke-width:1.1;stroke-linejoin:round;animation:bmIn .7s ease both}
.bm-s{fill:var(--hl-2);stroke:var(--map-gap);stroke-width:1.1;stroke-linejoin:round;animation:bmIn .7s ease both}
.pulse .bm-p{animation:bmIn .7s ease both,bmPulse 2.8s ease-in-out 1.2s infinite}
.bm-hit{fill:transparent;cursor:pointer;stroke:none}
.bm-hit:hover{fill:var(--hl-1);fill-opacity:.25}
.bmw.mini{width:46px}
.legend{display:flex;gap:16px;justify-content:center;font-size:12.5px;color:var(--fg-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .lp{background:var(--hl-1)}
.legend .ls{background:var(--hl-2)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:44px 20px}
.empty-ic{width:76px;height:76px;border-radius:26px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:8px;animation:float 3.6s ease-in-out infinite}
.empty-ic .i{width:36px;height:36px}
.empty b{font-size:19px;font-weight:750}
.empty p{color:var(--fg-2);font-size:15px;max-width:340px}
.empty .btn{margin-top:12px}

/* ---------- Training: Start ---------- */
.hero{position:relative;overflow:hidden;padding:18px;display:flex;flex-direction:column;gap:14px;isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-1;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none;animation:glow 6s ease-in-out infinite}
.hero-top{display:flex;gap:10px;align-items:flex-start}
.hero-tx{flex:1;min-width:0}
.kick{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:650;color:var(--accent)}
.kick .i{width:16px;height:16px}
.kick .pulse-dot{width:8px;height:8px;margin-right:3px}
.hero h2{font-size:27px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-top:7px}
.meta{color:var(--fg-2);font-size:14.5px;margin-top:7px}
.hero-map{width:104px;margin:-4px -6px 0 0}
.hero-list{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--sep);display:flex;flex-direction:column;gap:1px}
.hero-list li{position:relative;animation:rise .5s var(--ease) backwards;animation-delay:calc(160ms + var(--k) * 60ms)}
.hero-list li.ss::before{content:"";position:absolute;left:14px;top:16px;bottom:16px;width:2px;border-radius:2px;background:var(--accent-line)}
.hl-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;font-size:15.5px}
.hl-row .no{position:relative;z-index:1;justify-self:start}
.hl-n{font-weight:600;line-height:1.25}
.hl-d{color:var(--fg-2);font-size:13.5px;font-family:var(--font-num);white-space:nowrap}
.hl-more{color:var(--fg-2);font-size:14px;padding:6px 0 0 46px}
.hero-empty{color:var(--fg-2);font-size:15px}
.hero-cardio{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--fg-2);margin-top:-4px}
.hero-cardio .i{width:17px;height:17px;color:var(--c-sky)}
.hero-act{display:flex;gap:10px}
.hero.live{background:linear-gradient(160deg,color-mix(in oklab,var(--accent) 10%,var(--card)),var(--card) 60%)}
.live-time{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1}
.week{padding:16px;display:flex;flex-direction:column;gap:14px;margin-top:12px}
.week-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.week-h b{font-size:17px;font-weight:700}
.week-h small{display:block;color:var(--fg-2);font-size:13.5px;margin-top:1px}
.week-d{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px}
.wd small{font-size:12px;color:var(--fg-2);font-weight:650}
.wd span{width:38px;height:38px;max-width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:650;font-family:var(--font-num);background:var(--fill);color:var(--fg-2)}
.wd span .i{width:18px;height:18px;stroke-width:3}
.wd.on span{background:var(--accent-grad);color:var(--accent-ink);animation:wdPop .55s var(--spring) backwards;animation-delay:calc(220ms + var(--k) * 55ms)}
.wd.today small{color:var(--accent)}
.wd.today:not(.on) span{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.wd.fut span{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep)}
.streak{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 11px;border-radius:15px;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);white-space:nowrap}
.streak .i{width:16px;height:16px;animation:flicker 2.2s ease-in-out infinite}
.wk-ring .ring-c small{font-size:11.5px;font-weight:750}
.rgrid{display:grid;gap:10px}
.rcard{display:flex;align-items:center;overflow:hidden;transition:transform .2s var(--spring)}
.rcard.next{box-shadow:var(--shadow),inset 0 0 0 1.5px var(--accent-line)}
.rc-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 12px;text-align:left}
.rc-main:active{opacity:.7}
.rc-map{width:52px}
.rc-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc-name{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;font-weight:650;color:var(--fg-2)}
.rc-name em{font-style:normal;padding:1px 8px;border-radius:10px;background:var(--fill)}
.rc-name em.acc{background:var(--accent-soft);color:var(--accent)}
.rc-tx b{font-size:17px;font-weight:700;line-height:1.2}
.rc-tx small{font-size:13.5px;color:var(--fg-2)}
.rc-play{width:48px;height:48px;border-radius:50%;margin-right:12px;flex:none;background:var(--accent-grad);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--accent);transition:transform .2s var(--spring),opacity .2s}
.rc-play:active{transform:scale(.88)}
.rc-play:disabled{opacity:.3;box-shadow:none}
.rc-play .i{width:22px;height:22px;margin-left:2px}
.datebox{width:46px;height:46px;border-radius:13px;flex:none;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.datebox small{font-size:11px;font-weight:750}
.datebox b{font-size:19px;font-weight:800}

/* ---------- Training ansehen & bearbeiten ---------- */
.vrow{display:flex;align-items:center;gap:10px;margin:-4px 0 14px}
.vseg{flex:1}
.vone{flex:1;color:var(--fg-2);font-size:14.5px;padding-left:4px}
.rt-sum{display:flex;align-items:center;gap:12px;padding:14px 16px}
.rt-map{width:104px}
.rt-stats{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;text-align:center}
.rt-stats b{display:block;font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.rt-stats small{font-size:12.5px;color:var(--fg-2);font-weight:600}
.hint-t{font-size:13.5px;line-height:1.45;color:var(--fg-2);margin:10px 4px 0;animation:fadeUp .4s var(--ease)}
.olist{display:flex;flex-direction:column}
.ol-sec{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--fg-2);margin:18px 4px 8px}
.ol-sec .i{width:16px;height:16px}
.irow{padding:0 4px 0 10px;gap:0;min-height:66px;background:var(--card)}
.irow>.no{margin-right:4px}
.irow-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:9px 8px;min-height:66px;text-align:left}
.irow-main:active{opacity:.6}
.list .irow+.irow::before{left:96px}
.list .irow:not(:has(.no))+.irow::before,.olist .list:not(.ol-main) .irow+.irow::before{left:72px}
.irow[class*=" ss-"]{background:color-mix(in oklab,var(--accent) 6%,var(--card))}
.irow[class*=" ss-"]::after{content:"";position:absolute;left:23px;width:3px;border-radius:3px;background:var(--accent-line)}
.irow.ss-top::after{top:44px;bottom:0}
.irow.ss-mid::after{top:0;bottom:0}
.irow.ss-bot::after{top:0;bottom:44px}
.irow.ss-mid::before,.irow.ss-bot::before{left:58px!important}
.grip{width:46px;height:56px;display:grid;place-items:center;color:var(--fg-3);touch-action:none;cursor:grab;flex:none;border-radius:12px}
.grip:active{color:var(--accent)}
.ol-main.manual{overflow:visible}
.ol-main.manual>.irow:first-child{border-radius:18px 18px 0 0}
.ol-main.manual>.irow:last-child{border-radius:0 0 18px 18px}
.ol-main.manual>.irow:only-child{border-radius:18px}
.lnk{position:absolute;z-index:3;left:11px;bottom:0;transform:translateY(50%);width:28px;height:28px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--sep),0 2px 6px rgba(0,0,0,.10);color:var(--fg-3);display:grid;place-items:center;transition:background-color .25s,color .25s,transform .25s var(--spring),opacity .2s}
.lnk .i{width:15px;height:15px;stroke-width:2.4}
.lnk:active{transform:translateY(50%) scale(.85)}
.lnk.on{background:var(--accent);color:#fff;box-shadow:0 3px 10px -3px var(--accent)}
.is-drag .lnk{opacity:0;pointer-events:none}
.irow.dragging{z-index:10;border-radius:16px!important;box-shadow:0 22px 44px -14px rgba(0,0,0,.42),0 0 0 1px var(--sep)}
.irow.dragging::before{display:none}
.is-drag .irow{will-change:transform}

/* ---------- Laufendes Training ---------- */
.wo{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;transform:translateY(103%);visibility:hidden;transition:transform .52s var(--ease),visibility 0s .52s,border-radius .5s var(--ease)}
.wo.open{transform:none;visibility:visible;transition:transform .55s var(--ease),visibility 0s,border-radius .5s var(--ease)}
.wo-h{position:relative;z-index:2;flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gut-r) 10px var(--gut-l);background:var(--bar);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8)}
.wo-ht{text-align:center;display:flex;flex-direction:column;line-height:1.2}
.wo-ht b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-ht small{font-size:12.5px;color:var(--fg-2)}
.wo-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--sep)}
.wo-prog i{display:block;height:100%;background:var(--accent-grad);border-radius:0 3px 3px 0;transition:width .7s var(--spring)}
.wo-sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wo-grid{max-width:760px;margin:0 auto;padding:14px var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 48px) var(--gut-l);display:flex;flex-direction:column;gap:12px}
.wo-side{display:flex;flex-direction:column;gap:12px}
.wo-sum{display:none}
.wo-list{display:flex;flex-direction:column;gap:12px}
.wo-sec{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--fg-2);margin:10px 4px -2px}
.wo-sec .i{width:16px;height:16px}
.wo-end{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.timer{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tm-row{display:flex;align-items:center;gap:10px}
.tm-l{flex:1;min-width:0}
.tm-l .lab{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:650;color:var(--fg-2)}
.tm-l .lab .i{width:16px;height:16px}
.timer.run .tm-l .lab{color:var(--accent)}
.timer.run .tm-l .lab .i{animation:tick 1s steps(1) infinite}
.tm-t{font-family:var(--font-num);font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.timer:not(.run) .tm-t{color:var(--fg-2)}
.tm-btn{width:60px;height:60px;border-radius:50%;flex:none;background:var(--accent-grad);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 22px -10px var(--accent);transition:transform .22s var(--spring),background .3s}
.tm-btn:active{transform:scale(.88)}
.tm-btn.pause{background:var(--fill-2);color:var(--fg);box-shadow:none}
.tm-btn .i{width:26px;height:26px}
.tm-bar{height:7px;border-radius:4px;background:var(--fill);overflow:hidden}
.tm-bar i{display:block;height:100%;border-radius:4px;background:var(--accent-grad);transition:width 1s linear}
.tm-bar.over i{background:var(--amber-grad)}
.timer.over .tm-note{color:var(--warn)}
.tm-note{font-size:13.5px;color:var(--fg-2)}
.wo-sum{padding:16px;flex-direction:column;gap:12px;align-items:center}
.ws-top{display:flex;align-items:center;gap:12px;width:100%}
.ws-map{width:200px}
.exc{padding:14px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .35s ease;animation:rise .45s var(--ease) backwards}
.exc.done{box-shadow:var(--shadow),inset 0 0 0 1.5px var(--good-line)}
.exc-h{display:flex;align-items:center;gap:10px}
.exc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.exc-t b{font-size:16.5px;font-weight:650;line-height:1.25;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.exc-t small{font-size:13px;color:var(--fg-2);line-height:1.3}
.thumbw{position:relative;flex:none;display:block}
.exc-ok{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--good-fill);color:var(--good-ink);display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--card);transform:scale(0) rotate(-45deg);opacity:0;transition:transform .5s var(--spring),opacity .2s}
.exc-ok .i{width:14px;height:14px;stroke-width:3.4}
.exc.done .exc-ok{transform:none;opacity:1}
.exc-w{display:flex;flex-direction:column;gap:6px}
.lab{font-size:12.5px;font-weight:650;color:var(--fg-2);padding-left:2px}
.sets{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.set{position:relative;height:64px;border-radius:17px;background:var(--fill);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .2s var(--spring),background-color .25s,color .25s}
.set:active{transform:scale(.92)}
.set small{font-size:11.5px;font-weight:650;color:var(--fg-2)}
.set b{font-size:22px;font-weight:800;line-height:1}
.set.on{background:var(--good-fill);color:var(--good-ink);animation:setPop .55s var(--spring) backwards;animation-delay:calc(var(--k) * 60ms)}
.set.on small{color:inherit;opacity:.82}
.set.part{background:var(--amber-fill);color:var(--amber-ink)}
.set-ck{position:absolute;top:7px;right:7px;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.set.on .set-ck{opacity:1}
.set.on .set-ck path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out forwards;animation-delay:calc(var(--k) * 60ms + 140ms)}
.sug{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:13px;background:var(--good-soft);color:var(--good);font-size:13.5px;font-weight:600;animation:fadeUp .4s var(--ease)}
.sug .i{width:18px;height:18px}
.sug span{flex:1}
.sug button{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--good-fill);color:var(--good-ink);font-weight:700;font-size:13.5px}

.ssg{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:14px}
.ssg::before{content:"";position:absolute;left:0;top:30px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(var(--accent),var(--hl-2));transition:background .4s}
.ssg.done::before{background:var(--good-fill)}
.ssg-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);margin:2px 0 -2px -14px}
.ssg-h .i{width:15px;height:15px}
.cfs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.cf{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:13px;background:var(--card-2)}
.cf span{font-size:12px;font-weight:650;color:var(--fg-2)}
.cf input{width:100%;border:0;background:transparent;font-family:var(--font-num);font-size:19px;font-weight:750;color:var(--fg);outline:none;padding:0}

.cdone{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:15px;background:var(--fill);font-size:16px;font-weight:650;transition:background-color .3s,color .3s,transform .2s var(--spring)}
.cdone:active{transform:scale(.97)}
.cd-ic{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px currentColor;display:grid;place-items:center;transition:background-color .3s}
.cd-ic .i{width:15px;height:15px;stroke-width:3.2;opacity:0;transform:scale(.3);transition:transform .45s var(--spring),opacity .2s}
.cdone.on{background:var(--good-fill);color:var(--good-ink)}

/* Gewicht */
.wctl{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;gap:8px;align-items:center}

.wval{position:relative;height:50px;border-radius:15px;background:var(--card-2);display:flex;align-items:baseline;justify-content:center;gap:5px;padding-top:9px;cursor:text;box-shadow:inset 0 0 0 1px var(--sep)}
.wval .wshow{font-size:25px;font-weight:800;line-height:1.2;transition:opacity .15s}
.wval small{font-size:14px;color:var(--fg-2);font-weight:650;transition:opacity .15s}
.wval input{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:25px;font-weight:800;color:var(--fg);opacity:0;outline:none;padding:0}
.wval.edit{box-shadow:inset 0 0 0 2px var(--accent)}
.wval.edit .wshow,.wval.edit small{opacity:0}
.wval.edit input{opacity:1}
.wval.big{height:84px;min-width:170px;border-radius:22px;padding-top:12px}
.wval.big .wshow,.wval.big input{font-size:50px}
.fine{display:flex;align-items:center;justify-content:center;gap:10px}
.fine-s{display:flex;gap:6px}
.fine button{height:34px;min-width:58px;padding:0 10px;border-radius:17px;background:var(--fill);color:var(--fg-2);font-family:var(--font-num);font-size:14.5px;font-weight:700;transition:transform .18s var(--spring),background-color .2s,color .2s}
.fine button:active{transform:scale(.9);background:var(--fill-2);color:var(--fg)}
.fine-ax{width:1.5px;height:22px;border-radius:1px;background:var(--fill-2)}

/* ---------- Blätter ---------- */
.sheets{position:fixed;inset:0;z-index:60;pointer-events:none}
.shw{position:absolute;inset:0;pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fadeIn .32s ease both}
.shw.behind .scrim{background:transparent}
.shw.out .scrim{animation:fadeOut .28s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);display:flex;flex-direction:column;background:var(--sheet);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden;animation:shIn .52s var(--ease) backwards;transition:transform .42s var(--ease),filter .4s}
.sheet.tall{height:calc(100% - env(safe-area-inset-top,0px) - 16px)}
.shw.behind .sheet{transform:scale(.94) translateY(-12px);filter:brightness(.94)}
.shw.out .sheet{animation:shOut .28s cubic-bezier(.4,0,1,1) both}
.shw.out .sheet.dragged{animation:none}
.grab{flex:none;display:flex;justify-content:center;padding:7px 0 1px;touch-action:none;cursor:grab}
.grab i{width:38px;height:5px;border-radius:3px;background:var(--fg-3);opacity:.55}
.sh-head{flex:none;display:grid;grid-template-columns:minmax(max-content,1fr) minmax(0,auto) minmax(max-content,1fr);align-items:center;gap:8px;min-height:50px;padding:0 10px 8px;touch-action:none}
.sh-l{justify-self:start}
.sh-r{justify-self:end}
.sh-t{text-align:center;display:flex;flex-direction:column;line-height:1.25}
.sh-t b{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.sh-t small{font-size:12.5px;color:var(--fg-2)}
.sh-btn{height:38px;padding:0 10px;border-radius:12px;color:var(--accent);font-size:16.5px;white-space:nowrap;transition:opacity .2s}
.sh-btn.b{font-weight:700}
.sh-btn:active{opacity:.5}
.sh-btn:disabled{opacity:.35}
.sh-tools{flex:none;display:flex;flex-direction:column;gap:10px;padding:0 16px 10px}
.sh-tools .chips{margin:0 -16px;padding:2px 16px 2px}
.sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px 26px;display:flex;flex-direction:column;gap:14px}
.sheet.compact .sh-body{flex:none}
.sh-body>*{flex-shrink:0}
.sh-body.flush{gap:12px}
.sh-foot{flex:none;padding:8px 16px 12px;margin-top:-76px;transform:translateY(110%);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s,margin .45s var(--ease)}
.sh-foot.on{margin-top:0;transform:none;opacity:1;pointer-events:auto}
.confirm{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 22px 22px}
.cf-ic{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);animation:popIn .5s var(--spring) .05s both}
.cf-ic.dg{background:var(--danger-soft);color:var(--danger)}
.cf-ic .i{width:28px;height:28px}
.confirm h3{font-size:20px;font-weight:750}
.confirm p{color:var(--fg-2);font-size:15px;max-width:380px}
.cf-btns{display:flex;gap:10px;width:100%;margin-top:10px}
.list.form{overflow:visible}
.frow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:10px 14px}
.frow+.frow::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;transform:scaleY(.5);transform-origin:top;background:var(--sep)}
.frow>span:first-child{display:flex;flex-direction:column;font-size:16px;font-weight:550;line-height:1.3}
.frow>span:first-child small{font-size:12.5px;color:var(--fg-2);font-weight:400}
.frow.col{flex-direction:column;align-items:stretch;gap:10px}
.frow input:not([type=file]),.frow select{flex:1;min-width:0;height:38px;border:0;background:transparent;font-size:16.5px;color:var(--fg);text-align:right;outline:none;-webkit-appearance:none;appearance:none}
.frow select{color:var(--accent);font-weight:600;text-align-last:right;cursor:pointer}
.frow textarea{width:100%;border:0;border-radius:13px;background:var(--card-2);padding:10px 12px;font-size:16px;line-height:1.4;color:var(--fg);outline:none;resize:vertical;min-height:64px}
.frow textarea:focus{box-shadow:inset 0 0 0 2px var(--accent-line)}
.cf-in{display:flex;align-items:center;gap:6px}
.cf-in input{width:90px;flex:none}
.cf-in small{color:var(--fg-2);font-size:14px}
.menu .row{min-height:56px}
.menu .row+.row::before{left:60px}
.ish-top{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 10px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.ish-top:active{opacity:.7}
.ish-top .link{font-size:14px;flex:none}
.exrow.sel{background:color-mix(in oklab,var(--accent) 7%,var(--card))}
.pick{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px var(--fill-2);display:grid;place-items:center;color:transparent;transition:background-color .25s,box-shadow .25s,color .2s}
.pick .i{width:15px;height:15px;stroke-width:3.2;transform:scale(.3);transition:transform .4s var(--spring)}
.pick.on{background:var(--accent);box-shadow:none;color:#fff}
.pick.on .i{transform:none}
.ord-ex{align-items:flex-start;padding:14px}
.ord-b{width:28px;height:28px;border-radius:50%;flex:none;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-family:var(--font-num)}
.ord-ex small{margin-top:3px}
.why{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}
.why li::marker{color:var(--accent)}
.src{font-size:12.5px;color:var(--fg-3)}
.ai-btn,.ai-box{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--accent-line);text-align:left}
.ai-btn:active{opacity:.75}
.spin{width:24px;height:24px;flex:none;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.fin-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px}
.fin-map{width:min(250px,72%)}
.fin-hero b{font-size:17px;font-weight:700}
.pr-row{animation:rise .5s var(--ease) backwards;animation-delay:calc(300ms + var(--k) * 90ms)}
.pr-row .mi{animation:popIn .6s var(--spring) backwards;animation-delay:calc(420ms + var(--k) * 90ms)}
.pr-v{font-size:17px;font-weight:800;color:var(--accent)}

/* ---------- Verlauf ---------- */
.cal{padding:14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-t{font-size:17px;font-weight:750}
.cal-t.fl,.cal-t.fr{animation:fadeUp .35s var(--ease)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-wd small{font-size:11.5px;font-weight:700;color:var(--fg-3);padding:2px 0 4px}
.cal-days{min-height:240px;align-content:start}
.cal-days.fl{animation:calL .38s var(--ease)}
.cal-days.fr{animation:calR .38s var(--ease)}
.cd{width:100%;max-width:42px;aspect-ratio:1;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--fg);transition:transform .2s var(--spring)}
.cd:disabled{color:var(--fg-2)}
.cd.on{background:var(--accent-grad);color:var(--accent-ink);font-weight:750;animation:wdPop .5s var(--spring) backwards;animation-delay:calc(var(--k) * 12ms)}
.cd.on:active{transform:scale(.88)}
.cd.today:not(.on){box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:700}
.cal-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--sep)}
.cal-sum b{display:block;font-size:17px;font-weight:800}
.cal-sum small{font-size:12px;color:var(--fg-2)}

/* ---------- Übungen ---------- */
.lib-tools{display:flex;gap:8px;margin-bottom:12px}
.map-chip{height:44px;border-radius:13px;padding:0 14px}
.mapfilter{padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.bmw.pick{width:min(300px,86%);margin:0 auto}
.in-plan{width:22px;height:22px;border-radius:50%;flex:none;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.in-plan .i{width:13px;height:13px;stroke-width:3.2}
.ex-hero{padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ex-map{width:min(270px,78%)}
.ex-map.sm{width:min(190px,56%)}
.tips{list-style:none;margin:0;padding:0;counter-reset:t;display:flex;flex-direction:column;gap:8px}
.tips li{counter-increment:t;position:relative;padding:12px 14px 12px 50px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:15.5px;line-height:1.45;animation:rise .45s var(--ease) backwards;animation-delay:calc(var(--k) * 70ms)}
.tips li::before{content:counter(t);position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:800 13px/24px var(--font-num);text-align:center}
.exinfo{display:flex;flex-direction:column;gap:14px}
.two-col{display:flex;flex-direction:column;gap:12px}
.two-col .tips+.btn{margin-top:12px}
.chart-card{padding:14px 14px 10px}
.chart-fig{position:relative;width:100%}
.chart-fig svg{position:absolute;inset:0;display:block;overflow:visible}
.ch-grid{stroke:var(--sep);stroke-width:1;stroke-dasharray:3 5}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .15s forwards}
.ch-area{opacity:0;animation:fadeIn .9s ease .55s forwards}
.ch-dot{fill:var(--card);stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:dotIn .45s var(--spring) forwards}
.ch-dot.last{fill:var(--accent);stroke:var(--card);stroke-width:2.5}
.chart-ax{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--fg-2);font-family:var(--font-num)}

/* ---------- Profil ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:3px;padding:14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.stat small{font-size:13px;font-weight:600;color:var(--fg-2)}
.stat b{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}

.bw{padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.bw-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.bw-h small{display:block;font-size:13px;font-weight:600;color:var(--fg-2)}
.bw-h b{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.bw-h em{display:block;font-style:normal;font-size:13px;font-weight:650;color:var(--fg-2)}
.about{display:flex;align-items:center;justify-content:center;gap:8px;margin:30px 0 6px;font-size:13px;color:var(--fg-3)}
.theme-btn{position:relative;width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--card);color:var(--fg);box-shadow:var(--shadow),inset 0 0 0 .5px var(--sep);transition:transform .2s var(--spring)}
.theme-btn:active{transform:scale(.88)}
.theme-btn .i{position:absolute;width:20px;height:20px;transition:transform .6s var(--spring),opacity .3s}
.theme-btn .ti-moon{transform:rotate(-100deg) scale(.3);opacity:0}
.theme-btn.dk .ti-sun{transform:rotate(100deg) scale(.3);opacity:0}
.theme-btn.dk .ti-moon{transform:none;opacity:1}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* Hinweis & Konfetti */
.toast{position:fixed;z-index:90;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 9px;border-radius:26px;background:var(--toast-bg);color:var(--toast-fg);box-shadow:var(--sh-float);font-size:15px;font-weight:600;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.toast.in{animation:toastIn .6s var(--spring) both}
.toast.out{animation:toastOut .32s ease both}
.toast-ic{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:#2DB55D;color:#fff}

.toast-m{padding-right:8px;line-height:1.3}
.toast button{flex:none;height:32px;padding:0 13px;border-radius:16px;background:rgba(255,255,255,.16);color:inherit;font-size:14px;font-weight:700}
.confetti{position:fixed;inset:0;width:100%;height:100%;z-index:95;pointer-events:none}

/* ---------- Fortschrittsfotos ---------- */
.hist-seg{margin:-6px 0 4px}
.pframe{position:relative;container-type:inline-size;overflow:hidden;width:100%;border-radius:18px;background:#1A1716;isolation:isolate}

.pf-miss .i{width:28px;height:28px}
.po{position:absolute;z-index:1;left:calc(3.6cqw * var(--ps,1));top:calc(5cqw * var(--ps,1));width:15cqw;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;font-family:system-ui,-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;line-height:1.18;text-shadow:0 .15cqw .7cqw rgba(0,0,0,.45);pointer-events:none;transform:scale(var(--ps,1));transform-origin:0 0}
.po::before{content:"";position:absolute;z-index:-1;left:-22.5cqw;top:-5cqw;width:60cqw;height:60cqw;background:radial-gradient(circle closest-side,rgba(0,0,0,.22),transparent)}
.po-day{font-size:3cqw;font-weight:800;letter-spacing:.01em}
.po-l{font-size:1.05cqw;line-height:1.2;font-weight:600;opacity:.82;margin-top:1.6cqw}
.po-v{font-size:2.05cqw;font-weight:750;margin-top:.25cqw;white-space:nowrap}
.po-fig{width:12.5cqw;margin-top:2.6cqw}
.po-fig svg,.po-mark svg{display:block;width:100%;height:auto}
.po-logo{display:flex;flex-direction:column;align-items:center;gap:.6cqw;margin-top:2.4cqw}
.po-mark{width:3.6cqw}
.po-logo>span:last-child{font-size:1.15cqw;font-weight:800;letter-spacing:.14em;padding-left:.14em}
.ph-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 12px}
.ph-head b{display:block;font-size:17px;font-weight:700}
.ph-head small{display:block;font-size:13px;color:var(--fg-2)}
.ph-btns{display:flex;gap:8px;flex:none}
.ph-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ph-card{display:flex;flex-direction:column;gap:7px;text-align:left;transition:transform .22s var(--spring)}
.ph-card:active{transform:scale(.96)}
.pframe.grid{aspect-ratio:3/4!important;box-shadow:var(--shadow)}
.ph-cap{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:0 4px}
.ph-cap b{font-size:14.5px;font-weight:750}
.ph-cap small{font-size:12.5px;color:var(--fg-2)}
.nudge{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 12px;margin-bottom:12px}
.nudge-ic{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--accent-grad);color:var(--accent-ink);box-shadow:0 8px 18px -10px var(--accent)}

.nudge .row-tx b{font-size:15.5px}

.pe-drop:active{transform:scale(.98)}
.pe-drop input,.pe-swap input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.pe-ic{width:66px;height:66px;border-radius:21px;display:grid;place-items:center;margin-bottom:4px;background:var(--accent-grad);color:var(--accent-ink);box-shadow:0 12px 26px -12px var(--accent);animation:float 3.6s ease-in-out infinite}
.pe-ic .i{width:30px;height:30px}
.pe-drop.busy .pe-ic{animation:none}
.pe-drop b{font-size:17px;font-weight:700}
.pe-drop small{font-size:13.5px;color:var(--fg-2);max-width:330px;line-height:1.4}
.pe-prev{display:flex;flex-direction:column;align-items:center;gap:10px}
.pe-prev .pframe{width:min(100%,calc(50vh * var(--ar)));box-shadow:var(--sh-float);animation:popIn .45s var(--spring)}
.pe-swap{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;border-radius:18px;background:var(--fill);font-size:14.5px;font-weight:650;cursor:pointer}
.pe-swap .i{width:18px;height:18px}
.frow input[type=date]{color:var(--accent);font-weight:600;cursor:pointer}
.spin.light{width:18px;height:18px;border-color:rgba(255,255,255,.35);border-top-color:#fff}
.sheet.photo{background:#0D0B0A;color:#F7F2F0}
.sheet.photo .grab i{background:rgba(255,255,255,.55)}
.sheet.photo .sh-t small{color:rgba(255,255,255,.6)}
.sheet.photo .sh-btn{color:#FF8A50}
.pv-sc{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pv-sc::-webkit-scrollbar{display:none}
.pv-slide{flex:0 0 100%;min-width:0;scroll-snap-align:center;scroll-snap-stop:always;container-type:size;display:grid;place-items:center;padding:4px 14px}
.pframe.pv-frame{width:min(calc(100cqw - 28px),calc((100cqh - 8px) * var(--ar)));border-radius:16px;box-shadow:0 20px 60px -20px rgba(0,0,0,.8)}
.pv-info{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 20px 0;font-size:13.5px;color:rgba(255,255,255,.6)}
.pv-info b{color:#fff;font-size:15.5px;font-weight:650}
.pv-act{display:flex;align-items:center;gap:8px;padding:10px 16px 14px}
.pv-nav{width:48px;height:48px;background:rgba(255,255,255,.12);color:#fff}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cmp-s{display:flex;flex-direction:column;gap:7px;text-align:center;border-radius:20px;padding:4px;transition:box-shadow .25s,transform .2s var(--spring)}
.cmp-s:active{transform:scale(.97)}
.cmp-s.on{box-shadow:0 0 0 2.5px var(--accent)}
.cmp-s .pframe{aspect-ratio:3/4!important}
.cmp-s>span{font-size:13.5px;color:var(--fg-2)}
.cmp-s>span b{color:var(--fg)}
.cmp-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.cmp-strip::-webkit-scrollbar{display:none}
.cmp-t{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:3px;border-radius:14px;font-size:12px;font-weight:600;color:var(--fg-2);transition:box-shadow .2s,transform .2s var(--spring)}
.cmp-t:active{transform:scale(.94)}
.cmp-t.a,.cmp-t.b{box-shadow:0 0 0 2px var(--accent-line);color:var(--accent)}
.pframe.tiny{border-radius:11px}
.img-out{width:100%;border-radius:16px;box-shadow:var(--shadow)}
@media (min-width:760px){
  .ph-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
}

/* Ausrichten */
.pframe.aligned{background:#111}
.pframe img.pf-bg{filter:blur(18px) brightness(.55);transform:scale(1.12)}
.pframe img.pf-al{inset:auto;height:auto;max-width:none;object-fit:fill;transform-origin:50% 50%;transition:left .25s var(--ease),top .25s var(--ease),width .25s var(--ease),transform .25s var(--ease)}
.al-ed{position:relative;width:min(100%,calc(50vh * .75));touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.al-ed:active .pframe img.pf-al{transition:none}
.al-ed>.pframe{width:100%;box-shadow:var(--sh-float);animation:popIn .45s var(--spring)}
.al-ghost{position:absolute;inset:0;opacity:.38;pointer-events:none;border-radius:18px;overflow:hidden;mix-blend-mode:screen}
.al-ghost .pframe{width:100%;height:100%}
.al-ghost .pf-bg{display:none}
.al-guides{position:absolute;inset:0;pointer-events:none;border-radius:18px;overflow:hidden}
.al-guides i{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed rgba(255,255,255,.55)}
.al-guides i.gv{left:50%;right:auto;top:0;bottom:0;height:auto;border-top:0;border-left:1.5px dashed rgba(255,255,255,.35)}
.al-guides span{position:absolute;right:8px;transform:translateY(-120%);font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.al-stat{display:block;font-size:13.5px;line-height:1.4;color:var(--fg-2);text-align:center;min-height:22px;animation:fadeUp .3s var(--ease)}
.al-stat .i{width:17px;height:17px;display:inline-block;vertical-align:-3px;margin-right:5px}
.al-stat .spin{width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-right:6px}
.al-stat.ok{color:var(--good)}
.al-stat.warn{color:var(--warn)}
.al-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.al-btns .chip{height:36px;font-size:14px;padding:0 13px}
.al-btns .chip:disabled{opacity:.45}
.al-btns .pe-swap{background:var(--card)}
.al-sl{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.al-sl label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:650;color:var(--fg-2)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.fade{display:flex;flex-direction:column;gap:12px;align-items:center}
.fade-st{position:relative;width:min(100%,calc(52vh * .75));border-radius:18px;overflow:hidden;box-shadow:var(--sh-float)}
.fade-st .pframe{border-radius:0}
.fade-top{position:absolute;inset:0;transition:opacity .08s linear}
.fade-top .pframe{height:100%}
.fade-sl{display:flex;align-items:center;gap:10px;width:100%}
.fade-sl input{flex:1}
.fade-t{flex:none;height:32px;padding:0 10px;border-radius:16px;background:var(--fill);font-size:13px;font-weight:700;color:var(--fg-2)}
.fade-t.on{background:var(--accent-soft);color:var(--accent)}

/* ---------- Bewegungen ---------- */
.rise{animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--rd,0) * 65ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes pgIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pgOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes pgBack{from{transform:translateX(-28%)}to{transform:none}}
@keyframes shIn{from{transform:translateY(100%)}}
@keyframes shOut{to{transform:translateY(105%)}}
@keyframes dlgIn{from{opacity:0;transform:translate(-50%,-46%) scale(.95)}}
@keyframes dlgOut{to{opacity:0;transform:translate(-50%,-48%) scale(.96)}}
@keyframes footIn{from{opacity:0;transform:translateY(30px) scale(.94)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-24px) scale(.85)}to{opacity:1;transform:translateX(-50%)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.92)}}
@keyframes tbPop{0%{transform:scale(1)}35%{transform:scale(.8) translateY(2px)}70%{transform:scale(1.12) translateY(-2px)}100%{transform:none}}
@keyframes setPop{0%{transform:scale(.86);background-color:var(--fill);color:var(--fg)}55%{transform:scale(1.07)}100%{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dotIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes wdPop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:none}}
@keyframes rollIn{from{transform:translateY(70%);opacity:0}to{transform:none;opacity:1}}
@keyframes rollInDn{from{transform:translateY(-70%);opacity:0}to{transform:none;opacity:1}}
@keyframes rollOut{to{transform:translateY(-70%);opacity:0}}
@keyframes rollOutDn{to{transform:translateY(70%);opacity:0}}
@keyframes bmIn{from{opacity:0}to{opacity:1}}
@keyframes bmPulse{0%,100%{fill-opacity:1}50%{fill-opacity:.62}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent) 55%,transparent)}80%,100%{box-shadow:0 0 0 10px color-mix(in oklab,var(--accent) 0%,transparent)}}
@keyframes shine{0%,62%{transform:translateX(-120%)}82%,100%{transform:translateX(120%)}}
@keyframes glow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.75}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12) rotate(-6deg)}60%{transform:scale(.96) rotate(4deg)}}
@keyframes tick{0%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes calL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes calR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.ring-v{animation:ringIn 1.1s var(--ease) backwards}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}

/* ---------- iPad & breite Fenster ---------- */
@media (min-width:760px){
  :root{--side:240px;--gut-l:max(32px,env(safe-area-inset-left,0px));--gut-r:max(32px,env(safe-area-inset-right,0px));--bottom:48px}
  .tabbar{left:0;top:0;bottom:0;transform:none;width:var(--side);height:auto;border-radius:0;padding:calc(env(safe-area-inset-top,0px) + 20px) 14px 20px max(14px,env(safe-area-inset-left,0px));background:var(--side-bg);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset -1px 0 0 var(--sep);display:flex;flex-direction:column;gap:22px}
  .tb-brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:19px;font-weight:800;letter-spacing:-.01em}
  .tb-items{display:flex;flex-direction:column;height:auto;gap:4px}
  .tb-k{width:100%;height:50px;border-radius:15px;transform:translateY(calc(var(--i) * 54px))}
  .tb{flex-direction:row;justify-content:flex-start;gap:12px;height:50px;padding:0 14px;border-radius:15px;font-size:16px;font-weight:650}
  .tb:not(.on):hover{background:var(--fill)}
  .stage{left:var(--side)}
  .mini{left:14px;width:calc(var(--side) - 28px);bottom:20px;transform:translateY(24px) scale(.92);padding:0 10px 0 14px;height:62px;border-radius:18px}
  .mini.on{transform:none}
  .mini:active{transform:scale(.97)}
  .has-mini .pg-in{padding-bottom:var(--bottom)}
  .pg.has-foot .pg-in,.has-mini .pg.has-foot .pg-in{padding-bottom:110px}
  .pg-foot,.has-mini .pg-foot{bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
  .nb{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .lt h1{font-size:36px}
  .shell.sheet-on .stage{transform:none;border-radius:0;filter:brightness(.97)}
  .shell.sheet-on.wo-on .wo.open{transform:none;border-radius:0}
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(600px,calc(100% - 64px));max-height:min(86vh,880px);border-radius:28px;padding-bottom:0;transform:translate(-50%,-50%);animation:dlgIn .42s var(--ease) backwards;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
  .sheet.tall{height:min(86vh,880px)}
  .shw.behind .sheet{transform:translate(-50%,-50%) scale(.95);filter:brightness(.95)}
  .shw.out .sheet{animation:dlgOut .22s ease both}
  .grab{display:none}
  .sh-head{padding-top:12px}
  .rgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sheet .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lib-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .lib-list .row:nth-child(2)::before{display:none}
  .lib-list .row:nth-child(2n)::after{content:"";position:absolute;left:0;top:12px;bottom:12px;width:1px;transform:scaleX(.5);background:var(--sep)}
  .toast{top:calc(env(safe-area-inset-top,0px) + 18px)}
}
@media (min-width:1000px){
  .home-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:28px;align-items:start}
  .home-side>.sec-h:first-child{margin-top:4px}
  .hero{padding:22px}
  .hero-map{width:150px}
  .hero h2{font-size:31px}
  .hist-grid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
  .hist-cal{position:sticky;top:0}
  .hist-list>div:first-child .sec-h{margin-top:4px}
  .two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .two-col .sec-h:first-child{margin-top:4px}
  .two-col>.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prof-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .prof-grid>div>.sec-h:first-child{margin-top:4px}
  .prof-grid .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rgrid{grid-template-columns:1fr}
  .wo-grid{max-width:1200px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start;padding-top:20px}
  .wo-side{position:sticky;top:20px}
  .wo-sum{display:flex}
  .wo-h{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .ch-line{stroke-dashoffset:0}
  .ch-area,.ch-dot{opacity:1}
}

const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return {y, m, d}; };
const dayNum = s => { const {y, m, d} = parseISO(s); return Date.UTC(y, m - 1, d) / 864e5; };
const fromDayNum = n => { const t = new Date(n * 864e5); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
const addDays = (s, n) => fromDayNum(dayNum(s) + n);
const weekdayOf = s => ((new Date(dayNum(s) * 864e5).getUTCDay() + 6) % 7);

function fmtShort(s) { const {m, d} = parseISO(s); return `${d}. ${MON[m - 1]}`; }
function fmtLong(s) { const {y, m, d} = parseISO(s); return `${d}. ${MONTHS[m - 1]} ${y}`; }

/* Version 3 (alte App mit Kategorien und Ernährung) → Version 4 */
function fromV3(old) {
  const custom = Array.isArray(old.custom) ? old.custom : [];
  const exL = x => EX[x] || custom.find(c => c.id === x) || {};
  const os = old.set || {};
  const st = {
    v:4, updatedAt:old.updatedAt || 0, custom, logs:Array.isArray(old.logs) ? old.logs : [], body:Array.isArray(old.body) ? old.body : [],
    active:old.active || null,
    set:{sets:os.sets || 3, reps:os.reps || 10, inc:os.inc || 2.5, target:os.target == null ? 90 : os.target, goal:os.goal || 3, autoSw:true, bw:os.bw == null ? null : os.bw},
    days:[]
  };
  st.days = (old.days || []).map(d => {
    const items = [];
    (d.cats || []).forEach(c => (c.items || []).forEach(it => {
      if (!it || !it.x) return;
      items.push(Object.assign({}, it, {role:c.key === 'warmup' ? 'warm' : c.key === 'cardio' ? 'cool' : 'main'}));
    }));
    const nd = {id:d.id || uid(), grp:d.grp || d.id, vn:d.vn || 'A', name:d.name || 'Training', title:null, items, ord:d.ord || {m:'alt', seq:[], link:[]}};
    const oldTitle = joinNames((d.cats || []).filter(c => c.key !== 'warmup' && c.key !== 'cardio').map(c => c.name).filter(Boolean));
    if (oldTitle && oldTitle !== autoTitle(nd, exL)) nd.title = oldTitle;

function migrate(st) {

  const custom = Array.isArray(st.custom) ? st.custom.filter(c => c && c.id && c.n) : [];

/* Die Claude-Laufzeit kann nach dem Start der Seite kommen – bis zu 12 s darauf warten */
let claudeP = null;
function whenClaude() {
  if (!claudeP) claudeP = new Promise(res => {
    const ok = () => window.claude && typeof window.claude.use === 'function';
    if (ok()) { res(window.claude); return; }
    const t0 = Date.now();
    const iv = setInterval(() => { if (ok()) { clearInterval(iv); res(window.claude); } else if (Date.now() - t0 > 12000) { clearInterval(iv); res(null); } }, 100);
  });
  return claudeP;
}
let BOOT_BLANK = false;
const SYNC = {ref:null, mode:NATIVE ? 'device' : 'local', writing:false, dirty:false, timer:null, retries:0};
function queueRemote(len) {
  if (!SYNC.ref) return;
  if (len > 245000) { SYNC.mode = 'toolarge'; return; }
  SYNC.dirty = true; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flushRemote, 1200);
}
async function flushRemote() {
  if (!SYNC.ref || SYNC.writing || !SYNC.dirty) return;
  SYNC.writing = true; SYNC.dirty = false;
  try {
    const json = JSON.stringify(S);
    if (json.length > 245000) SYNC.mode = 'toolarge';
    else { await SYNC.ref.set({updatedAt:S.updatedAt, v:4, state:JSON.parse(json)}); SYNC.mode = 'cloud'; SYNC.retries = 0; }
  } catch (e) {
    SYNC.mode = 'error';
    if (SYNC.retries < 3) { SYNC.retries++; SYNC.dirty = true; }
  }
  SYNC.writing = false;
  if (SYNC.dirty) SYNC.timer = setTimeout(flushRemote, 2500 + Math.random() * 2000);
  emit();
}
async function initSync() {
  if (NATIVE) return;
  try {
    SYNC.mode = 'pending'; emit();
    const cl = await whenClaude();
    if (!cl) { SYNC.mode = 'local'; emit(); return; }
    const [dbNs, userNs] = await Promise.all([cl.use('db'), cl.use('user')]);
    if (!dbNs || !userNs) { SYNC.mode = 'local'; emit(); return; }
    const id = await userNs.id();
    if (!id) { SYNC.mode = 'local'; emit(); return; }
    const ref = dbNs.doc('data/users/' + id + '/kraftbuch4');
    const snap = await ref.get();
    let remote = snap.exists ? snap.data() : null, fromOld = false;
    if (!remote) { try { const o = await dbNs.doc('data/users/' + id + '/kraftbuch').get(); if (o.exists) { remote = o.data(); fromOld = true; } } catch (e) {} }
    SYNC.ref = ref;
    const rLogs = remote && remote.state && Array.isArray(remote.state.logs) ? remote.state.logs.length : 0;
    const hasKg = S.days.some(d => d.items.some(i => i.kg != null && i.kg > 0));
    const weak = BOOT_BLANK || (fromOld && (S.logs.length < rLogs || !hasKg));
    if (remote && remote.state && (weak || (remote.updatedAt || 0) > (S.updatedAt || 0))) {
      const m = migrate(clone(remote.state));
      if (m) {
        /* was hier schon neu eingetragen wurde, bleibt erhalten */
        const ids = new Set(m.logs.map(l => l.id));
        S.logs.forEach(l => { if (!ids.has(l.id)) m.logs.push(l); });
        m.logs.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : (a.start || 0) - (b.start || 0)));
        const pids = new Set(m.photos.map(p => p.id)); (S.photos || []).forEach(p => { if (!pids.has(p.id)) m.photos.push(p); });
        if (m.active && Date.now() - (m.active.start || 0) > 12 * 3600000) m.active = null;
        if (S.active) m.active = S.active;
        m.updatedAt = weak ? Date.now() : remote.updatedAt; S = m; BOOT_BLANK = false; saveLocal(JSON.stringify(S)); afterLoad();
        if (weak) { SYNC.dirty = true; flushRemote(); toast('Deine Daten sind wieder da', {icon:'check'}); }
      }
      if (snap.exists) SYNC.mode = 'cloud'; else { SYNC.dirty = true; flushRemote(); }
    } else { SYNC.dirty = true; flushRemote(); }
    emit();
  } catch (e) { SYNC.ref = null; SYNC.mode = 'error'; emit(); }
}
function syncInfo() {
  switch (SYNC.mode) {
    case 'cloud': return {c:'good', t:'Mit deinem Claude-Konto synchronisiert'};
    case 'pending': return {c:'mute', t:'Synchronisierung wird verbunden …'};
    case 'error': return {c:'warn', t:'Gespeichert auf diesem Gerät · Sync gerade nicht erreichbar'};
    case 'toolarge': return {c:'warn', t:'Gespeichert auf diesem Gerät · zu viele Daten für den Sync'};
    case 'device': return {c:'good', t:'Gespeichert auf deinem iPhone'};

/* Richtzeit: Mitteilung in der iPhone-App, Hinweis in der App */
const NOTIF_ID = 4711;

  try {
    NATIVE.cancel(NOTIF_ID);
    const a = S && S.active; const tgt = S && S.set.target;
    if (!a || !a.sw || !a.sw.run || !tgt || a.tgtHit) return;
    const remain = tgt * 60000 - swElapsed(a);

    const d = dayById(a.day);
    NATIVE.notifyAt(NOTIF_ID, Date.now() + remain, 'Richtzeit erreicht', `${tgt} Minuten ${d ? dayTitle(d) : 'Training'} – Zeit fürs Cardio oder den Abschluss.`);
  } catch (e) {}
}

}

function NavStack({tab, live}) {

function SheetFrame({s, depth}) {
  const def = SHEETS[s.t] || SHEETS.missing;
  const ref = useRef(null), drag = useRef(null);
  const down = e => {
    if (e.button) return;

  };
  return html`<div class=${cx('shw', s.closing && 'out', depth > 0 && 'behind')}>
    <div class="scrim" onClick=${() => closeSheet(s.k)}></div>
    <section class=${cx('sheet', def.cls)} ref=${ref} role="dialog" aria-modal="true" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}>
      <div class="grab" aria-hidden="true"><i></i></div>
