/* Linien-Diagramm, gezeichnet in echter Pixelbreite */
let chartSeq = 0;
function LineChart({pts, h = 150, fmt = v => fmtNum(v, 1)}) {
  const ref = useRef(null); const [w, setW] = useState(0);
  const gid = useMemo(() => 'chg' + (++chartSeq), []);
  useLayoutEffect(() => {
    const el = ref.current; if (!el) return;
    setW(el.clientWidth);
    const ro = new ResizeObserver(() => setW(el.clientWidth)); ro.observe(el);
    return () => ro.disconnect();
  }, []);
  let svg = null;
  if (w && pts.length) {
    const padX = 10, padT = 16, padB = 10;
    const xs = pts.map(p => dayNum(p.d)); const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const vs = pts.map(p => p.v); let v0 = Math.min(...vs), v1 = Math.max(...vs);
    if (v1 - v0 < 1) { v0 -= 1; v1 += 1; } const pd = (v1 - v0) * .18; v0 -= pd; v1 += pd;
    const X = x => padX + (x1 === x0 ? (w - 2 * padX) / 2 : (x - x0) / (x1 - x0) * (w - 2 * padX));
    const Y = v => padT + (1 - (v - v0) / (v1 - v0)) * (h - padT - padB);
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
    const area = pts.length > 1 ? line + `L${X(xs[xs.length - 1]).toFixed(1)},${h}L${X(xs[0]).toFixed(1)},${h}Z` : '';
    const last = pts[pts.length - 1];
    svg = html`<svg width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} aria-hidden="true">
      <defs><linearGradient id=${gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.24"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
      ${[0.25, 0.5, 0.75].map(f => html`<line class="ch-grid" x1="0" x2=${w} y1=${(padT + f * (h - padT - padB)).toFixed(1)} y2=${(padT + f * (h - padT - padB)).toFixed(1)}/>`)}
      ${area ? html`<path class="ch-area" d=${area} fill=${`url(#${gid})`}/>` : null}
      ${pts.length > 1 ? html`<path class="ch-line" d=${line} pathLength="1"/>` : null}
      ${pts.map((p, i) => html`<circle class=${cx('ch-dot', i === pts.length - 1 && 'last')} cx=${X(xs[i]).toFixed(1)} cy=${Y(p.v).toFixed(1)} r=${i === pts.length - 1 ? 5 : 3} style=${{animationDelay:(300 + i / Math.max(1, pts.length - 1) * 700) + 'ms'}}/>`)}
    </svg>`;
    return html`<div class="chart"><div class="chart-fig" ref=${ref} style=${{height:h + 'px'}}>${svg}</div><div class="chart-ax"><span>${fmtShort(pts[0].d)}</span><span>höchster Wert ${fmt(Math.max(...vs))}</span><span>${fmtShort(last.d)}</span></div></div>`;
  }
  return html`<div class="chart"><div class="chart-fig" ref=${ref} style=${{height:h + 'px'}}></div></div>`;
}

/* Konfetti zum Abschluss */
function confetti() {
  if (reduced()) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; c.setAttribute('aria-hidden', 'true'); document.body.appendChild(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const cols = ['#FF6B35', '#FFB25C', '#34C759', '#0A84FF', '#FF375F', '#FFCC33', '#BF5AF2'];
  const ps = [];
  for (let i = 0; i < 150; i++) {
    const left = i % 2 === 0;
    ps.push({x:left ? -10 : W + 10, y:H * 0.8, vx:(left ? 1 : -1) * (3.5 + Math.random() * 9), vy:-(10 + Math.random() * 10), r:Math.random() * 6, vr:(Math.random() - .5) * .35, w:6 + Math.random() * 6, hh:9 + Math.random() * 7, c:cols[i % cols.length], round:Math.random() < .28});
  }
  const t0 = performance.now();
  const step = t => {
    const k = (t - t0) / 1000; ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = clamp(2.8 - k, 0, 1); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.3); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.hh / 2, p.w, p.hh * Math.max(.2, Math.abs(Math.cos(p.r * 1.7))));
      ctx.restore();
    });
    if (k < 2.9) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

const HOST_THEME = document.documentElement.dataset.theme || null;
function themeMode() { try { const t = localStorage.getItem(LS_THEME); return t === 'dark' || t === 'light' ? t : 'system'; } catch (e) { return 'system'; } }
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function applyThemeMode(mode) {
  if (mode === 'system') { if (HOST_THEME) document.documentElement.dataset.theme = HOST_THEME; else delete document.documentElement.dataset.theme; try { localStorage.removeItem(LS_THEME); } catch (e) {} }
  else { document.documentElement.dataset.theme = mode; try { localStorage.setItem(LS_THEME, mode); } catch (e) {} }
  syncStatusBar();
}
function syncStatusBar() { const dk = isDark(); if (NATIVE && NATIVE.statusBar) { try { NATIVE.statusBar(dk); } catch (e) {} } const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dk ? '#0C0A09' : '#F4F1EF'; }
function setTheme(mode, ev) {
  const run = () => { applyThemeMode(mode); emit(); };
  const el = ev && ev.currentTarget;
  if (!el || !document.startViewTransition || reduced()) { run(); return; }
  const r = el.getBoundingClientRect(); const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  try {
    const t = document.startViewTransition(() => { applyThemeMode(mode); });
    t.ready.then(() => { document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`]}, {duration:560, easing:'cubic-bezier(.32,.72,0,1)', pseudoElement:'::view-transition-new(root)'}); }).catch(() => {});
    t.finished.then(() => emit(), () => emit());
  } catch (e) { run(); }
}

  const rects = rows.map(r => { const b = r.getBoundingClientRect(); return {top:b.top + sc.scrollTop, h:b.height}; });
  let bottom = sc.getBoundingClientRect().bottom;
  document.querySelectorAll('.tabbar, .tabpane.on .pgw:last-child .pg-foot .btn, .mini.on').forEach(el => { const r = el.getBoundingClientRect(); if (r.width && r.left < innerWidth / 2 && r.right > innerWidth / 2 && r.top < bottom) bottom = r.top; });
  drag = {d, id, rows, row, list, rects, i, j:i, sc, pid:ev.pointerId, y0:ev.clientY + sc.scrollTop, cy:ev.clientY, cy0:ev.clientY, bottom, moved:false, raf:0};
  rows.forEach(el => { el.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1)'; });
  row.style.transition = 'box-shadow .2s, background .2s'; row.classList.add('dragging'); list.classList.add('is-drag');
  haptic('medium');
  try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (x) {}
  drag.raf = requestAnimationFrame(dragLoop);
}
function dragUpdate() {
  const g = drag; if (!g) return;
  const dy = g.cy + g.sc.scrollTop - g.y0; if (Math.abs(dy) > 4) g.moved = true;
  g.row.style.transform = `translateY(${dy}px) scale(1.03)`;
  const r = g.rects[g.i]; const center = r.top + r.h / 2 + dy; let j = g.i;
  for (let k = 0; k < g.i; k++) if (center < g.rects[k].top + g.rects[k].h / 2) { j = k; break; }
  for (let k = g.rects.length - 1; k > g.i; k--) if (center > g.rects[k].top + g.rects[k].h / 2) { j = k; break; }
  if (j !== g.j) haptic('light');
  g.j = j;
  g.rows.forEach((el, k) => { if (k === g.i) return; const t = g.i < j && k > g.i && k <= j ? -r.h : g.i > j && k >= j && k < g.i ? r.h : 0; el.style.transform = t ? `translateY(${t}px)` : ''; });
}
function dragLoop() {
  const g = drag; if (!g) return;
  if (g.moved) {
    const top = g.sc.getBoundingClientRect().top + 100, bottom = g.bottom - 56;
    const v = g.cy < top && g.cy < g.cy0 - 20 ? -Math.ceil((top - g.cy) / 6) : g.cy > bottom && g.cy > g.cy0 + 20 ? Math.ceil((g.cy - bottom) / 6) : 0;
    if (v) { g.sc.scrollTop += v; dragUpdate(); }
  }
  g.raf = requestAnimationFrame(dragLoop);
}
function dragEnd(ok) {
  const g = drag; if (!g) return; drag = null; cancelAnimationFrame(g.raf);
  g.rows.forEach(el => { el.style.transform = ''; el.style.transition = ''; });
  g.row.classList.remove('dragging'); g.list.classList.remove('is-drag');
  if (ok && g.moved && g.j !== g.i) { moveInOrder(g.d, g.id, g.j); haptic('medium'); }
}
document.addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.pid) return; e.preventDefault(); drag.cy = e.clientY; dragUpdate(); }, {passive:false});
document.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.pid) dragEnd(true); });
document.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) dragEnd(false); });
document.addEventListener('keydown', e => { if (drag && e.key === 'Escape') dragEnd(false); });

  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = .7 * u; ctx.shadowOffsetY = .15 * u;
  const F = (w, s) => { ctx.font = `${w} ${s}px ${OV_FONT}`; };
  F(800, 3 * u); ctx.fillText(`TAG ${day}`, cx0, y); y += 3 * u * 1.18;
  ovRows(inf).forEach(([l, v]) => {
    y += 1.6 * u; ctx.globalAlpha = .82; F(600, 1.05 * u); ctx.fillText(l, cx0, y);
    y += 1.05 * u * 1.2 + .25 * u; ctx.globalAlpha = 1; F(750, 2.05 * u); ctx.fillText(v, cx0, y);
    y += 2.05 * u * 1.18;

  y += fh + 2.4 * u;

  y += 3.6 * u + .6 * u;

  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = .7 * u; ctx.shadowOffsetY = .15 * u;

}

/* ---------- Automatisches Ausrichten: Körper erkennen, Oberkörper immer gleich platzieren ---------- */
/* Zielrahmen 3:4 in Rahmenbreiten: Schultermitte bei (0,5 | 0,5), Hüftmitte 0,58 darunter */
const AL_T = {x:0.5, y:0.5, torso:0.58, fh:4 / 3};
let ML = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); }); }
function loadPose() {
  if (!ML) ML = (async () => {
    if (!window.tf) await loadScript('ml/tf.min.js');
    const tf = window.tf;
    try { await tf.setBackend('webgl'); await tf.ready(); } catch (e) {}
    if (tf.getBackend() !== 'webgl') { await tf.setBackend('cpu'); await tf.ready(); }
    const r = await fetch('ml/movenet.json'); if (!r.ok) throw new Error('model');
    const j = await r.json();
    const bin = Uint8Array.from(atob(j.weightData), c => c.charCodeAt(0)).buffer;
    const model = await tf.loadGraphModel(tf.io.fromMemory({modelTopology:j.modelTopology, weightSpecs:j.weightSpecs, weightData:bin, format:j.format, generatedBy:j.generatedBy, convertedBy:j.convertedBy, signature:j.signature}));
    return {tf, model};
  })().catch(e => { ML = null; throw e; });
  return ML;
}
async function runMove(ml, img, cr) {
  const {tf, model} = ml;
  const c = document.createElement('canvas'); c.width = c.height = 192;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 192, 192);
  const k = 192 / cr.w;
  ctx.drawImage(img, -cr.x * k, -cr.y * k, img.naturalWidth * k, img.naturalHeight * k);
  const out = tf.tidy(() => model.execute(tf.browser.fromPixels(c).toInt().expandDims(0)));
  const a = await out.data(); out.dispose();
  const kp = [];
  for (let i = 0; i < 17; i++) kp.push({x:cr.x + a[i * 3 + 1] * cr.w, y:cr.y + a[i * 3] * cr.h, s:a[i * 3 + 2]});
  return kp;
}
async function detectPose(img) {
  const ml = await loadPose();
  const iw = img.naturalWidth, ih = img.naturalHeight, m = Math.max(iw, ih);
  let kp = await runMove(ml, img, {x:(iw - m) / 2, y:(ih - m) / 2, w:m, h:m});
  /* zweiter, genauerer Durchgang auf einem Ausschnitt um den Körper */
  const g = kp.filter(p => p.s > 0.25);
  if (g.length >= 4) {
    const x0 = Math.min(...g.map(p => p.x)), x1 = Math.max(...g.map(p => p.x)), y0 = Math.min(...g.map(p => p.y)), y1 = Math.max(...g.map(p => p.y));
    const sz = Math.max(m * 0.3, Math.max(x1 - x0, y1 - y0) * 1.6);
    const kp2 = await runMove(ml, img, {x:(x0 + x1) / 2 - sz / 2, y:(y0 + y1) / 2 - sz / 2, w:sz, h:sz});
    const avg = a => [0, 1, 2, 5, 6, 11, 12].reduce((t, i) => t + a[i].s, 0);
    if (avg(kp2) >= avg(kp) * 0.9) kp = kp2;
  }
  return kp;
}
/* Ausrichtung aus den erkannten Punkten berechnen (MoveNet: 0 Nase, 1/2 Augen, 5/6 Schultern, 11/12 Hüfte) */
function alignFrom(kp, iw, ih) {
  const ok = i => kp[i] && kp[i].s >= 0.3;
  const mid = (a, b) => ({x:(kp[a].x + kp[b].x) / 2, y:(kp[a].y + kp[b].y) / 2});
  const lineAng = (a, b) => { const [p, q] = kp[a].x <= kp[b].x ? [kp[a], kp[b]] : [kp[b], kp[a]]; return -Math.atan2(q.y - p.y, q.x - p.x); };
  let S, T, r, q;
  if (ok(5) && ok(6)) {
    S = mid(5, 6);
    const sw = Math.hypot(kp[6].x - kp[5].x, kp[6].y - kp[5].y);
    if (ok(11) && ok(12)) {
      const H = mid(11, 12); const vx = H.x - S.x, vy = H.y - S.y;
      T = Math.hypot(vx, vy); r = Math.atan2(vx, vy); q = 'torso';
      if (vy <= 0 || T < sw * 0.85 || T > sw * 2.6) { T = sw / 0.72; r = lineAng(5, 6); q = 'shoulders'; }
    } else { T = sw / 0.72; r = lineAng(5, 6); q = 'shoulders'; }
  } else if (ok(1) && ok(2)) {
    const E = mid(1, 2); const ed = Math.hypot(kp[2].x - kp[1].x, kp[2].y - kp[1].y);
    T = ed * 5.6; r = lineAng(1, 2); S = {x:E.x, y:E.y + ed * 2.6}; q = 'face';
  } else return null;
  if (!(T > 4)) return null;
  r = clamp(r, -0.35, 0.35);
  const k = AL_T.torso / T;
  const dx = S.x - iw / 2, dy = S.y - ih / 2;
  const rx = Math.cos(r) * dx - Math.sin(r) * dy, ry = Math.sin(r) * dx + Math.cos(r) * dy;
  return {s:Math.round(iw * k * 1000) / 1000, r:Math.round(r * 1000) / 1000, x:Math.round((AL_T.x - k * rx) * 1000) / 1000, y:Math.round((AL_T.y - k * ry) * 1000) / 1000, q, auto:true};
}
/* Ausgangslage ohne Erkennung: Foto füllt den 3:4-Rahmen */
function coverAl(iw, ih) { const a = iw / ih; return {s:a > 0.75 ? AL_T.fh * a : 1, r:0, x:0.5, y:AL_T.fh / 2, q:'manual', auto:false}; }
async function autoAlign(url) {
  const img = await loadImg(url);
  const kp = await detectPose(img);
  return alignFrom(kp, img.naturalWidth, img.naturalHeight);
}
const AL_Q = {torso:'Schultern und Hüfte erkannt', shoulders:'Schultern erkannt', face:'Gesicht erkannt', manual:'Von dir ausgerichtet'};
function alStyle(A) { return {left:(A.x * 100) + '%', top:(A.y / AL_T.fh * 100) + '%', width:(A.s * 100) + '%', transform:`translate(-50%,-50%) rotate(${A.r}rad)`}; }

}

/* Vorschau zum Nachjustieren: ziehen = verschieben, zwei Finger bzw. Regler = Größe */
function AlignEditor({ph, url, al, setAl, ghost}) {
  const ref = useRef(null), pts = useRef(new Map()), g0 = useRef(null);
  const A = al;
  const start = () => { const el = ref.current; const ps = [...pts.current.values()]; g0.current = {al:Object.assign({}, A), w:el.getBoundingClientRect().width, p:ps.map(p => Object.assign({}, p))}; };
  const down = e => { if (!A) return; e.preventDefault(); pts.current.set(e.pointerId, {x:e.clientX, y:e.clientY}); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} start(); };
  const move = e => {
    if (!A || !pts.current.has(e.pointerId) || !g0.current) return;
    pts.current.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const g = g0.current, ps = [...pts.current.values()];
    const n = Object.assign({}, g.al, {auto:false, q:'manual'});
    const c0 = g.p.reduce((a, p) => ({x:a.x + p.x / g.p.length, y:a.y + p.y / g.p.length}), {x:0, y:0});
    const c1 = ps.reduce((a, p) => ({x:a.x + p.x / ps.length, y:a.y + p.y / ps.length}), {x:0, y:0});
    n.x = g.al.x + (c1.x - c0.x) / g.w; n.y = g.al.y + (c1.y - c0.y) / g.w;
    if (ps.length >= 2 && g.p.length >= 2) {
      const d0 = Math.hypot(g.p[0].x - g.p[1].x, g.p[0].y - g.p[1].y), d1 = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
      if (d0 > 10) n.s = clamp(g.al.s * d1 / d0, 0.3, 6);
    }
    setAl(n);
  };
  const up = e => { pts.current.delete(e.pointerId); if (pts.current.size) start(); else g0.current = null; };
  const wheel = e => { if (!A) return; e.preventDefault(); setAl(Object.assign({}, A, {s:clamp(A.s * (e.deltaY < 0 ? 1.04 : 0.96), 0.3, 6), auto:false, q:'manual'})); };
  const f = frameWH(ph, A);
  return html`<div class="al-ed" ref=${ref} style=${{width:`min(100%, calc(50vh * ${(f.w / f.h).toFixed(4)}))`}} onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up} onWheel=${wheel}>
    <${PhotoFrame} ph=${ph} url=${url} al=${A}/>
    ${ghost && A ? html`<div class="al-ghost"><${PhotoFrame} ph=${ghost} al=${ghost.al} bare/></div>` : null}
    ${A ? html`<div class="al-guides" aria-hidden="true"><i class="gv"></i><i class="gs" style=${{top:(AL_T.y / AL_T.fh * 100) + '%'}}></i><i class="gh" style=${{top:((AL_T.y + AL_T.torso) / AL_T.fh * 100) + '%'}}></i><span style=${{top:(AL_T.y / AL_T.fh * 100) + '%'}}>Schultern</span><span style=${{top:((AL_T.y + AL_T.torso) / AL_T.fh * 100) + '%'}}>Hüfte</span></div>` : null}
  </div>`;
}

function CalCard({ym, setYm}) {

function aiErr(e) {
  const c = e && e.code;
  if (c === 'cancelled' || c === 'aborted') return '';
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { AI.ok = false; return 'Claude ist hier nicht freigegeben. Trag die Angaben einfach selbst ein.'; }
  if (c === 'rate_limited') return 'Gerade zu viele Anfragen. Versuch es in einer Minute nochmal.';
  if (c === 'session_expired') return 'Bitte melde dich bei Claude neu an.';
  if (['refused', 'empty_completion', 'invalid_json', 'empty'].includes(c)) return 'Das konnte Claude nicht erkennen. Schreib den Namen etwas genauer.';
  return 'Verbindung unterbrochen. Bitte nochmal versuchen.';
}
function aiPrompt(c) {

  const eq = Object.entries(EQUIP).map(([k, q]) => `${k} = ${q.l}`).join('; ');
  const gr = Object.entries(GROUPS).map(([k, g]) => `${k} = ${g.l}`).join('; ');
  return `Du bist ein erfahrener Fitnesstrainer. Prüfe diese Kraft- bzw. Fitnessübung für eine Trainings-App und ergänze fehlende Angaben.

Name: "${(c.n || '').slice(0, 80)}"
Bisher gewählt: Gerät ${c.e}, Gruppe ${c.g}, Hauptmuskeln [${c.p.join(', ')}], mitbeansprucht [${c.s.join(', ')}]
Bisherige Hinweise: ${(c.tt || '').slice(0, 600) || '–'}

Erlaubte Werte:
Muskeln: ${mus}
Gerät: ${eq}
Gruppe: ${gr}

Antworte nur mit JSON:
{"known":true,"name":"üblicher deutscher Name","equipment":"kh","group":"bauch","primary":["abs"],"secondary":["obliques"],"unit":"r","tips":["…","…","…"],"note":""}

Regeln:
- primary: 1–3 Hauptmuskeln, secondary: 0–4 mitbeanspruchte Muskeln, nur Schlüssel aus der Liste, keine Überschneidung.
- equipment und group nur aus den erlaubten Werten. Passt die bisherige Wahl, behalte sie.
- unit: "s" nur bei Halteübungen (z. B. Plank), sonst "r".
- tips: genau 3 kurze, konkrete Ausführungshinweise auf Deutsch (je höchstens 120 Zeichen), mit Fokus auf saubere, sichere Technik.
- name: korrigierte Schreibweise bzw. der übliche deutsche Name; wenn der Name schon passt, unverändert.
- Ist die Übung unklar oder unbekannt: known false, beste Vermutung trotzdem ausfüllen und in note (höchstens 120 Zeichen) kurz sagen, was unklar ist. Sonst note leer.`;
}

        <label class="frow"><span>Gruppe</span><select value=${c.g} onChange=${e => upd({g:e.target.value})}>${Object.entries(GROUPS).map(([k, g]) => html`<option value=${k}>${g.l}</option>`)}</select></label>
      </div>
      ${AI.ok ? (ai && ai.busy ? html`<div class="ai-box"><span class="spin" aria-hidden="true"></span><span class="row-tx"><b>Claude prüft die Übung …</b><small>Ausführung und Muskeln werden ergänzt.</small></span><button class="btn sm gray" onClick=${() => ctl.current && ctl.current.abort()}>Stopp</button></div>`
        : html`<button class="ai-btn" onClick=${runAI}><span class="mi acc"><${Icon} n="spark"/></span><span class="row-tx"><b>Von Claude prüfen & ergänzen</b><small>Ausführung, Haupt- und Hilfsmuskeln, Gerät und Gruppe – du kannst danach alles ändern.</small></span><${Icon} n="chevron" c="chev"/></button>`) : null}
      ${ai && ai.msg ? html`<p class="note warn">${ai.msg}</p>` : null}
      ${ai && ai.done ? html`<div class="sug ok"><${Icon} n="check"/><span>${ai.note}</span></div>${ai.name && ai.name !== c.n ? html`<button class="btn sm tint" onClick=${() => { upd({n:ai.name}); setAi(Object.assign({}, ai, {name:''})); }}><${Icon} n="pencil"/>Namen übernehmen: „${ai.name}“</button>` : null}` : null}
      ${c.g === 'cardio' ? null : html`<${Seg} v=${c.u} opts=${[['r', 'Wiederholungen'], ['s', 'Sekunden halten']]} on=${u => upd({u})} label="Einheit"/>`}
      <div class="card ex-hero"><${BodyMap} p=${c.p} s=${c.s} cls="ex-map sm"/><${Legend}/></div>
      <h3 class="sub-h">Hauptmuskeln</h3><div class="chips wrap">${Object.keys(MUSCLES).map(m => chip(m, 'p'))}</div>
      <h3 class="sub-h">Mitbeansprucht</h3><div class="chips wrap">${Object.keys(MUSCLES).map(m => chip(m, 's'))}</div>
      <h3 class="sub-h">Ausführung</h3>
      <div class="list form"><label class="frow col"><textarea rows="4" placeholder="Ein Hinweis pro Zeile, z. B. „Rücken gerade halten“" value=${c.tt} onInput=${e => upd({tt:e.target.value})} aria-label="Ausführung"></textarea></label></div>
      ${ex ? html`<button class="btn danger block" onClick=${del}><${Icon} n="trash"/>Übung löschen</button>` : null}
    </div>`;
}};

/* ---------- Reiter Profil ---------- */
SCREENS.prof = {t:() => 'Profil', c:ProfScreen};
function ProfScreen() {
  const [all, setAll] = useState(false);
  const n = S.logs.length; const wk = weekDays().days.filter(x => x.done).length; const streak = weekStreak();
  const hours = S.logs.reduce((a, l) => a + logDurMs(l), 0) / 3600000;
  const recs = records();
  return html`<${Page} title="Profil" ltRight=${html`<${ThemeBtn}/>`}>
    <div class="prof-grid">
      <div>
        <div class="stat-grid rise">
          <div class="stat"><small>Trainings</small><b class="num"><${CountUp} to=${n}/></b></div>
          <div class="stat"><small>Diese Woche</small><b class="num">${wk}<span class="of">/${S.set.goal}</span></b></div>
          <div class="stat"><small>Wochen in Folge</small><b class="num"><${CountUp} to=${streak}/></b></div>
          <div class="stat"><small>Trainingszeit</small><b class="num"><${CountUp} to=${hours} fmt=${v => fmtNum(v, 1)}/> Std</b></div>
        </div>
        <${BWCard}/>
        <div class="sec-h"><h2>Bestleistungen</h2>${recs.length > 5 ? html`<button class="link" onClick=${() => setAll(!all)}>${all ? 'Weniger' : 'Alle'}</button>` : null}</div>
        ${recs.length ? html`<div class="list rise" style="--rd:2">${recs.slice(0, all ? 60 : 5).map((r, k) => html`<button class="row" onClick=${() => push('ex', {x:r.x})}><span class="mi gold"><${Icon} n="trophy"/></span><span class="row-tx"><b>${exOf(r.x).n}</b><small>${fmtShort(r.d)}${r.first < r.k ? ` · +${fmtNum(r.k - r.first)} kg seit Beginn` : ''}</small></span><b class="num pr-v">${kgStr(r.k)}</b></button>`)}</div>` : html`<p class="note">Nach deinen ersten Trainings stehen hier deine schwersten Gewichte je Übung.</p>`}
      </div>
      <div>
        <div class="sec-h"><h2>Einstellungen</h2></div>
        <${Settings}/>
        <div class="sec-h"><h2>Daten</h2></div>
        <${DataCard}/>
        <p class="about"><${AppMark} size=${22}/>Kraftbuch ${APP_VERSION}${NATIVE ? ' · iPhone-App' : ''}</p>
      </div>
    </div>
  <//>`;
}
function BWCard() {
  const pts = S.body.map(([d, v]) => ({d, v})); const cur = latestBW();
  const first = pts.length ? pts[0].v : null; const delta = pts.length > 1 ? r1(cur - first) : null;
  return html`<section class="card bw rise" style="--rd:1">
    <div class="bw-h"><div><small>Körpergewicht</small><b class="num">${cur ? fmtNum(cur, 1) : '–'}<span class="of"> kg</span></b>${delta ? html`<em class=${delta < 0 ? 'dn' : 'up'}>${delta > 0 ? '+' : '−'}${fmtNum(Math.abs(delta), 1)} kg seit ${fmtShort(pts[0].d)}</em>` : null}</div><button class="btn sm tint" onClick=${() => openSheet('bw')}><${Icon} n="plus"/>Eintragen</button></div>
    ${pts.length >= 2 ? html`<${LineChart} pts=${pts} h=${120} fmt=${v => fmtNum(v, 1) + ' kg'}/>` : html`<p class="note">Trag dein Gewicht ab und zu ein – hier entsteht deine Kurve.</p>`}
  </section>`;
}
SHEETS.bw = {cls:'compact', c:function BWSheet({close}) {
  const [v, setV] = useState(latestBW() || 75);
  const [txt, setTxt] = useState(null);
  const step = d => { setV(x => clamp(r1((x || 0) + d), 20, 300)); haptic('light'); };
  const save = () => { setBW(todayISO(), v); close(); toast(`${fmtNum(v, 1)} kg eingetragen`); haptic('success'); };
  const recent = S.body.slice(-6).reverse();
  return html`<${SheetHead} title="Körpergewicht" sub=${'heute, ' + fmtLong(todayISO())} left=${html`<${Cancel} close=${close}/>`} right=${html`<${Done} onClick=${save} label="Eintragen"/>`}/>
    <div class="sh-body">
      <div class="step big"><button class="step-b" onClick=${() => step(-0.1)} aria-label="100 Gramm weniger"><${Icon} n="minus"/></button>
        <label class=${cx('wval big', txt != null && 'edit')}><span class="wshow num" aria-hidden="true"><${Roll} v=${fmtNum(v, 1)} n=${v}/></span><input class="num" inputmode="decimal" enterkeyhint="done" value=${txt == null ? fmtNum(v, 1) : txt} onFocus=${e => { setTxt(fmtNum(v, 1)); const t = e.target; setTimeout(() => { try { t.select(); } catch (x) {} }, 0); }} onInput=${e => setTxt(e.target.value)} onBlur=${() => { const nv = parseNum(txt); setTxt(null); if (!isNaN(nv)) setV(clamp(r1(nv), 20, 300)); }} onKeyDown=${e => { if (e.key === 'Enter') e.target.blur(); }} aria-label="Körpergewicht in Kilogramm"/><small>kg</small></label>
        <button class="step-b" onClick=${() => step(0.1)} aria-label="100 Gramm mehr"><${Icon} n="plus"/></button></div>
      <div class="fine center"><div class="fine-s"><button onClick=${() => step(-1)}>−1</button><button onClick=${() => step(-0.5)}>−0,5</button></div><span class="fine-ax" aria-hidden="true"></span><div class="fine-s"><button onClick=${() => step(0.5)}>+0,5</button><button onClick=${() => step(1)}>+1</button></div></div>
      ${recent.length ? html`<h3 class="sub-h">Letzte Einträge</h3><div class="list">${recent.map(([d, kg]) => html`<div class="row"><span class="row-tx"><b>${fmtLong(d)}</b></span><b class="num">${fmtNum(kg, 1)} kg</b><button class="ibtn sm" onClick=${() => { setBW(d, null); haptic('light'); }} aria-label=${`Eintrag vom ${fmtLong(d)} löschen`}><${Icon} n="trash"/></button></div>`)}</div>` : null}
    </div>`;
}};
function Settings() {
  const st = S.set;
  const upd = fn => { fn(st); commit(); };
  const tm = themeMode();
  return html`<div class="list form rise" style="--rd:3">
    <div class="frow"><span>Richtzeit<small>Hinweis, wenn die Stoppuhr sie erreicht</small></span><${Step} value=${st.target ? String(st.target) : 'aus'} unit=${st.target ? 'Min' : ''} onDec=${() => upd(s => { s.target = Math.max(0, (s.target || 0) - 5); })} onInc=${() => upd(s => { s.target = Math.min(300, (s.target || 0) + 5); })} label="Richtzeit" decLabel="5 Minuten weniger" incLabel="5 Minuten mehr"/></div>
    <div class="frow"><span>Stoppuhr startet automatisch<small>mit dem Training</small></span><${Toggle} on=${!!st.autoSw} onChange=${v => upd(s => { s.autoSw = v; })} label="Stoppuhr startet automatisch"/></div>
    <div class="frow"><span>Wochenziel</span><${Step} value=${String(st.goal)} unit="pro Woche" onDec=${() => upd(s => { s.goal = clamp(s.goal - 1, 1, 7); })} onInc=${() => upd(s => { s.goal = clamp(s.goal + 1, 1, 7); })} label="Wochenziel"/></div>
    <div class="frow"><span>Sätze<small>für neue Übungen</small></span><${Step} value=${String(st.sets)} onDec=${() => upd(s => { s.sets = clamp(s.sets - 1, 1, 10); })} onInc=${() => upd(s => { s.sets = clamp(s.sets + 1, 1, 10); })} label="Sätze"/></div>
    <div class="frow"><span>Wiederholungen<small>für neue Übungen</small></span><${Step} value=${String(st.reps)} onDec=${() => upd(s => { s.reps = clamp(s.reps - 1, 1, 50); })} onInc=${() => upd(s => { s.reps = clamp(s.reps + 1, 1, 50); })} label="Wiederholungen"/></div>
    <div class="frow col"><span>Gewichtsschritt<small>Kurzhanteln: höchstens 2 kg, dazu feine Schritte</small></span><${Seg} v=${String(st.inc)} opts=${[['1.25', '1,25 kg'], ['2.5', '2,5 kg'], ['5', '5 kg']]} on=${v => upd(s => { s.inc = parseFloat(v); })} label="Gewichtsschritt"/></div>
    <div class="frow col"><span>Darstellung</span><${Seg} v=${tm} opts=${[['system', 'Automatisch'], ['light', 'Hell'], ['dark', 'Dunkel']]} on=${m => setTheme(m)} label="Darstellung"/></div>
    ${NATIVE ? html`<${NotifyRow}/>` : null}
  </div>`;
}
function NotifyRow() {
  const [st, setSt] = useState('?');
  useEffect(() => { try { NATIVE.permission().then(setSt, () => setSt('?')); } catch (e) {} }, []);
  const ask = () => { try { NATIVE.requestPermission().then(s => { setSt(s); if (s === 'granted') { toast('Mitteilungen erlaubt', {icon:'bell'}); scheduleTarget(); } else toast('Erlaube Mitteilungen in den iPhone-Einstellungen › Kraftbuch', {icon:'bell', tone:'warn'}); }); } catch (e) {} };
  return html`<div class="frow"><span>Mitteilung bei Richtzeit<small>${st === 'granted' ? 'erlaubt – auch wenn die App im Hintergrund ist' : st === 'denied' ? 'in den iPhone-Einstellungen ausgeschaltet' : 'noch nicht erlaubt'}</small></span>${st === 'granted' ? html`<span class="ok-dot"><${Icon} n="check"/></span>` : html`<button class="btn sm tint" onClick=${ask}>Erlauben</button>`}</div>`;
}

/* Daten sichern & übertragen (z. B. vom Browser in die iPhone-App) */
let DL = null;
function initDL() { if (NATIVE) return; whenClaude().then(cl => cl && cl.use('downloads')).then(ns => { if (ns) { DL = ns; emit(); } }, () => {}); }
async function exportFile() {
  const name = backupName(); let json;
  if ((S.photos || []).length) { toast('Sicherung mit Fotos wird erstellt …', {icon:'image'}); json = await backupWithPhotos(); }
  else json = backupJSON();
  if (NATIVE && NATIVE.shareFile) { try { await NATIVE.shareFile(name, json); } catch (e) { if (!(e && /cancel/i.test(String(e.message || e)))) toast('Teilen hat nicht geklappt', {icon:'x', tone:'warn'}); } return; }
  if (!DL) { copyBackup(); return; }
  try { await DL.save({filename:name, data:json}); toast('Sicherung gespeichert', {icon:'download'}); }
  catch (e) { const c = e && e.code; if (c === 'declined') return; if (c === 'rate_limited') toast('Einen Moment – versuch es gleich nochmal', {icon:'clock', tone:'warn'}); else { DL = null; emit(); toast('Speichern geht hier nicht – nutze „Sicherung kopieren“', {icon:'copy', tone:'warn'}); } }
}
async function copyBackup() {
  const json = backupJSON();
  try { await navigator.clipboard.writeText(json); toast('Sicherung kopiert – in der anderen App einfügen', {icon:'copy'}); return; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = json; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0'; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    if (ok) { toast('Sicherung kopiert', {icon:'copy'}); return; }
  } catch (e) {}
  openSheet('showbackup');
}
function DataCard() {
  const info = syncInfo();
  return html`<div class="list rise" style="--rd:4">
    <div class="row"><span class=${'sdot ' + info.c}></span><span class="row-tx"><b>${info.t}</b><small>${NATIVE ? 'Sichere deine Daten ab und zu als Datei.' : 'Für die iPhone-App: Sicherung speichern oder kopieren und dort laden.'}</small></span></div>
    ${DL || (NATIVE && NATIVE.shareFile) ? html`<button class="row" onClick=${exportFile}><span class="mi"><${Icon} n="download"/></span><span class="row-tx"><b>Sicherung speichern</b><small>${NATIVE ? 'als Datei teilen oder in „Dateien“ sichern' : 'als Datei herunterladen'}${(S.photos || []).length ? ' – mit Fotos' : ''}</small></span><${Icon} n="chevron" c="chev"/></button>` : null}
    <button class="row" onClick=${copyBackup}><span class="mi"><${Icon} n="copy"/></span><span class="row-tx"><b>Sicherung kopieren</b><small>als Text in die Zwischenablage${(S.photos || []).length ? ' – ohne Fotos' : ''}</small></span><${Icon} n="chevron" c="chev"/></button>
    <button class="row" onClick=${() => openSheet('restore')}><span class="mi"><${Icon} n="upload"/></span><span class="row-tx"><b>Sicherung laden</b><small>aus einer Datei oder eingefügtem Text</small></span><${Icon} n="chevron" c="chev"/></button>
  </div>`;
}
SHEETS.showbackup = {c:({close}) => html`<${SheetHead} title="Sicherung" right=${html`<${Done} close=${close}/>`}/><div class="sh-body"><p class="note">Markiere den Text und kopiere ihn.</p><div class="list form"><label class="frow col"><textarea rows="8" readonly value=${backupJSON()} onFocus=${e => e.target.select()} aria-label="Sicherung als Text"></textarea></label></div></div>`};
SHEETS.restore = {c:function RestoreSheet({close}) {
  const [txt, setTxt] = useState(''); const [err, setErr] = useState('');
  const load = async raw => {
    const r = parseBackup(raw); if (r.err) { setErr(r.err); haptic('warning'); return; }
    const m = r.state; const np = r.photos ? Object.keys(r.photos).length : 0;
    if (!(await confirmSheet({title:'Sicherung laden?', text:`${plural(m.logs.length, 'Training', 'Trainings')}, ${plural(dayGroupsOf(m).length, 'Trainingsplan', 'Trainingspläne')}${np ? ' und ' + plural(np, 'Foto', 'Fotos') : ''}. Deine Daten auf diesem Gerät werden dadurch ersetzt.`, ok:'Laden', icon:'upload', danger:false}))) return;
    close(); if (np) toast('Fotos werden übernommen …', {icon:'image'});
    await applyBackup(m, r.photos); toast('Sicherung geladen', {icon:'check'}); haptic('success');
  };
  const file = e => { const f = e.target.files && e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => load(String(rd.result || '')); rd.readAsText(f); e.target.value = ''; };
  const paste = async () => { try { const t = await navigator.clipboard.readText(); if (t) { setTxt(t); setErr(''); } } catch (x) { setErr('Einfügen ging nicht automatisch – halte im Feld gedrückt und wähle „Einsetzen“.'); } };
  return html`<${SheetHead} title="Sicherung laden" left=${html`<${Cancel} close=${close}/>`}/>
    <div class="sh-body">
      <label class="btn tint block file-btn"><${Icon} n="upload"/>Datei auswählen<input type="file" accept=".json,application/json,text/plain" onChange=${file}/></label>
      <p class="note center">oder den kopierten Text hier einfügen</p>
      <div class="list form"><label class="frow col"><textarea rows="5" value=${txt} onInput=${e => { setTxt(e.target.value); setErr(''); }} placeholder='{"app":"Kraftbuch", …}' aria-label="Sicherung als Text"></textarea></label></div>
      ${err ? html`<p class="note warn">${err}</p>` : null}
      <div class="btn-row"><button class="btn gray grow" onClick=${paste}><${Icon} n="copy"/>Einfügen</button><button class="btn go grow" disabled=${!txt.trim()} onClick=${() => load(txt)}>Laden</button></div>
    </div>`;
}};
function dayGroupsOf(st) { return uniq(st.days.map(d => d.grp || d.id)); }
SHEETS.missing = {c:({close}) => html`<${SheetHead} title="" right=${html`<${Done} close=${close}/>`}/>`};
SCREENS.missing = {t:() => '', c:({back}) => html`<${Page} title="Nicht gefunden" back=${back}/>`};

/* ---------- App ---------- */
function App() {
  const [, force] = useReducer(x => x + 1, 0);
  useEffect(() => { listeners.add(force); return () => listeners.delete(force); }, []);
  const sheetOn = U.sheets.some(s => !s.closing);
  return html`<div class=${cx('shell', sheetOn && 'sheet-on', S.active && !U.wo && 'has-mini', U.wo && S.active && 'wo-on')}>
    <${TabBar}/>
    <main class="stage">${TABS.map(([k]) => html`<${TabPane} key=${k} tab=${k} on=${U.tab === k} live=${U.tab === k && !(U.wo && S.active)}/>`)}</main>
    <${MiniBar}/>
    <${Workout}/>
    <${SheetHost}/>
    <${Toast}/>
  </div>`;
}
function boot() {
  S = loadLocal();
  if (!S) { S = blankState(); BOOT_BLANK = true; }
  if (S.migratedFrom) { delete S.migratedFrom; S.updatedAt = S.updatedAt || Date.now(); persistNow(); }
  if (S.active) U.wo = true;
  const sp = document.getElementById('sprite'); if (sp) sp.innerHTML = bodySprite();
  prender(html`<${App}/>`, document.getElementById('app'));
  syncStatusBar();
  if (NATIVE) nativeBoot(); else { initSync(); initAI(); initDL(); initAssets(); }
  if (S.active) { scheduleTarget(); requestWake(); }
  document.documentElement.classList.add('ready');
}
async function nativeBoot() {
  try {
    const raw = NATIVE.load ? await NATIVE.load() : null;
    if (raw) { const m = migrate(JSON.parse(raw)); if (m && (m.updatedAt || 0) > (S.updatedAt || 0)) { S = m; saveLocal(JSON.stringify(S)); afterLoad(); if (S.active) U.wo = true; emit(); } }
    else persistNow();
  } catch (e) {}
  try { if (NATIVE.onResume) NATIVE.onResume(() => { checkTarget(); emit(); }); } catch (e) {}
  scheduleTarget();
}
try { boot(); } catch (e) {
  const el = document.getElementById('app');
  if (el) el.innerHTML = '<div style="padding:40px 24px;font:16px/1.5 -apple-system,system-ui,sans-serif"><b>Kraftbuch konnte nicht starten.</b><br>Bitte lade die Seite neu.</div>';
  console.error(e);
}

})();
</script>
